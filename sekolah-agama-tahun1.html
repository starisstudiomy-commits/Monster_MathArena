<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agama T1">
<meta name="theme-color" content="#0B4F3F">
<title>Sekolah Agama Tahun 1 — Kuiz & Lencana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&family=Baloo+2:wght@500;600;700;800&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SEKOLAH AGAMA TAHUN 1 — Kuiz & Koleksi Lencana
   Palet: hijau zamrud + emas (adik-beradik visual dgn MathArena
   yg guna ungu + emas). Komponen chunky yg sama: butang tebal
   dgn bayang pepejal, pil krim, panel bergradien.
   ============================================================ */
:root{
  /* Scheherazade diletak sbg fallback dlm stack utama supaya glif Arab
     (cth ﷺ) dlm teks Melayu biasa tak jatuh ke font sistem yg tak konsisten */
  --font:"Fredoka","Baloo 2","Scheherazade New",system-ui,sans-serif;
  --arab:"Scheherazade New",serif;

  --bg-deep:#062D24;
  --bg-mid:#0B4F3F;
  --panel-a:#12705A;
  --panel-b:#0C5544;

  --gold:#F5C542;
  --gold-light:#FFE066;
  --gold-deep:#C99200;
  --cream:#FFF4D6;

  --text:#FFFFFF;
  --text-soft:#CDEBE0;
  --text-muted:#8FBFAE;
  --text-dark:#0A3A2E;

  --green:#4ADE80;
  --red:#F87171;
  --blue:#60A5FA;

  --radius:22px;
  --radius-sm:16px;
  --radius-pill:999px;
  --shadow-card:0 6px 0 0 rgba(0,0,0,.22), 0 12px 28px rgba(0,0,0,.28);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;touch-action:manipulation}
/* JANGAN letak height:100% pada body bersama overflow-x:hidden — body akan jadi
   scroll container setinggi viewport & kandungan panjang (album lencana) tak boleh
   ditatal. Guna min-height sahaja supaya viewport yg menatal seperti biasa. */
html,body{overflow-x:hidden}
body{
  font-family:var(--font);font-weight:600;color:var(--text);
  background:var(--bg-deep);min-height:100dvh;
  overscroll-behavior-x:none;user-select:none;-webkit-user-select:none;
}

#bg{
  position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse 90% 60% at 50% -10%, rgba(74,222,128,.28), transparent 55%),
    radial-gradient(ellipse 70% 50% at 100% 80%, rgba(245,197,66,.14), transparent 50%),
    radial-gradient(ellipse 60% 40% at 0% 60%, rgba(45,212,191,.18), transparent 50%),
    linear-gradient(180deg,#0B4F3F 0%,#083A2F 45%,#052019 100%);
}
/* corak geometri lembut - rujukan hiasan Islamik, bukan imej luar */
#bg::before{
  content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.5) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.5) 0 1px, transparent 1px 34px);
}
#bg::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #FFE066, transparent),
    radial-gradient(1px 1px at 34% 66%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 72% 28%, #4ADE80, transparent),
    radial-gradient(1px 1px at 88% 72%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 55% 88%, #FFE066, transparent);
  animation:twinkle 5s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:.8}}

#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:12px 12px calc(24px + env(safe-area-inset-bottom));position:relative}
.screen{animation:screenIn .28s ease}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ---- PANEL ---- */
.panel{
  background:linear-gradient(180deg,var(--panel-a) 0%,var(--panel-b) 100%);
  border:3px solid rgba(255,255,255,.16);
  border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow-card);margin-bottom:12px;
}

/* ---- BUTANG ---- */
.btn{
  font-family:var(--font);font-weight:800;font-size:14px;
  color:var(--text-dark);border:none;border-radius:var(--radius-sm);
  padding:14px 18px;cursor:pointer;width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s ease, filter .12s ease;letter-spacing:.4px;
}
.btn:active{transform:translateY(3px)}
.btn-primary{
  background:linear-gradient(180deg,#FFE066 0%,#F5C542 45%,#E0A800 100%);
  color:var(--text-dark);border:3px solid var(--cream);
  box-shadow:0 5px 0 0 var(--gold-deep), inset 0 2px 0 rgba(255,255,255,.5);
}
.btn-primary:active{box-shadow:0 2px 0 0 var(--gold-deep)}
.btn-cta{
  background:linear-gradient(180deg,#FFE066 0%,#F5C542 45%,#E0A800 100%);
  color:var(--text-dark);font-weight:900;font-size:15px;
  border:3px solid var(--cream);border-radius:var(--radius-pill);
  box-shadow:0 5px 0 0 var(--gold-deep), inset 0 2px 0 rgba(255,255,255,.55);
  animation:ctaPulse 2.2s ease-in-out infinite;
}
.btn-cta:active{transform:translateY(3px);box-shadow:0 2px 0 0 var(--gold-deep)}
@keyframes ctaPulse{
  0%,100%{box-shadow:0 5px 0 0 #C99200, 0 0 0 0 rgba(245,197,66,.4)}
  50%{box-shadow:0 5px 0 0 #C99200, 0 0 20px 4px rgba(245,197,66,.35)}
}
.btn-secondary{
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.09));
  border:3px solid rgba(255,255,255,.28);color:#fff;
  box-shadow:0 4px 0 0 rgba(0,0,0,.22);
}
.btn-green{background:linear-gradient(180deg,#86EFAC,#22C55E);color:#052E16;border:3px solid #BBF7D0;box-shadow:0 5px 0 0 #15803D}
.btn-sm{font-size:12px;padding:10px 14px;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none!important;filter:grayscale(.35)}

/* ---- TOPBAR & PIL ---- */
.topbar{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pill{
  background:linear-gradient(180deg,#FFF8E7 0%,#FFE8A8 100%);
  border:2.5px solid var(--cream);border-radius:var(--radius-pill);
  padding:6px 12px;font-weight:800;font-size:12px;
  display:flex;align-items:center;gap:5px;color:var(--text-dark);
  box-shadow:0 3px 0 0 rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.7);
  white-space:nowrap;
}
.iconbtn{
  width:40px;height:40px;flex:0 0 auto;border-radius:14px;font-size:18px;padding:0;
  background:linear-gradient(180deg,#FFF8E7 0%,#FFE8A8 100%);
  border:2.5px solid var(--cream);color:var(--text-dark);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 0 rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .12s;
}
.iconbtn:active{transform:translateY(2px)}

/* ---- LOGO ---- */
.logo{text-align:center;margin:8px 0 2px;line-height:1}
.logo .l1{font-size:13px;font-weight:700;letter-spacing:5px;color:var(--gold-light);display:block;margin-bottom:4px}
.logo .l2{font-size:27px;font-weight:900;letter-spacing:.5px;display:block;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.28), 0 0 22px rgba(245,197,66,.35)}
.subtitle{color:var(--text-soft);text-align:center;margin:6px 0 14px;font-size:12px;font-weight:600;letter-spacing:1px}
.section-label{font-size:11px;letter-spacing:2.5px;font-weight:800;color:var(--gold-light);margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.section-label::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,rgba(245,197,66,.5),transparent);border-radius:2px}

/* ---- GRID SUBJEK ---- */
.subj-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subj{
  border:3px solid rgba(255,255,255,.18);border-radius:var(--radius-sm);
  padding:12px 10px;text-align:center;cursor:pointer;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  box-shadow:0 4px 0 0 rgba(0,0,0,.22);transition:transform .12s;
}
.subj:active{transform:translateY(3px)}
.subj .ico{font-size:30px;display:block;line-height:1.15}
.subj .nm{display:block;font-size:13px;font-weight:800;margin-top:5px}
.subj .mt{display:block;font-size:10px;color:var(--text-muted);margin-top:2px;font-weight:700;letter-spacing:.5px}
.subj.soon{opacity:.55;cursor:default;box-shadow:0 4px 0 0 rgba(0,0,0,.15)}
.subj.soon:active{transform:none}
.subj .tag{
  position:absolute;top:-9px;right:5px;font-size:9px;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(180deg,#FFE066,#E0A800);color:var(--text-dark);
  padding:3px 8px;border-radius:var(--radius-pill);border:2px solid var(--cream);
}
.subj .tag.grey{background:linear-gradient(180deg,#CBD5E1,#94A3B8);border-color:#E2E8F0;color:#1E293B}

/* ---- SENARAI BAB ---- */
.bab{
  display:flex;align-items:center;gap:11px;padding:12px;border-radius:var(--radius-sm);
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  border:3px solid rgba(255,255,255,.18);box-shadow:0 4px 0 0 rgba(0,0,0,.2);
  margin-bottom:9px;cursor:pointer;transition:transform .12s;
}
.bab:active{transform:translateY(3px)}
.bab.soon{opacity:.5;cursor:default}
.bab.soon:active{transform:none}
.bab .n{
  width:36px;height:36px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;
  font-size:14px;font-weight:900;color:var(--text-dark);
  background:linear-gradient(180deg,#FFF8E7,#FFE8A8);border:2px solid var(--cream);
}
.bab.soon .n{background:linear-gradient(180deg,#CBD5E1,#94A3B8);border-color:#E2E8F0}
.bab .t{flex:1;min-width:0}
.bab .t b{display:block;font-size:13.5px;font-weight:800}
.bab .t span{display:block;font-size:10.5px;color:var(--text-muted);margin-top:2px;font-weight:700}

/* ---- BAR PROGRES ---- */
.pbar{height:12px;border-radius:var(--radius-pill);background:rgba(0,0,0,.3);overflow:hidden;border:2px solid rgba(255,255,255,.18)}
.pbar>i{display:block;height:100%;border-radius:var(--radius-pill);background:linear-gradient(180deg,#FFE066,#E0A800);transition:width .35s ease}

/* ---- KUIZ ---- */
.qcard{
  background:linear-gradient(180deg,#FFF8E7 0%,#FFE8A8 100%);
  border:4px solid var(--cream);border-radius:var(--radius);
  padding:20px 16px;text-align:center;color:var(--text-dark);
  box-shadow:var(--shadow-card);margin-bottom:14px;
}
.qcard .qemoji{font-size:52px;line-height:1.1;display:block;margin-bottom:8px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.qcard .qtext{font-size:17px;font-weight:800;line-height:1.45}

.choice{
  width:100%;font-family:var(--font);font-size:14.5px;font-weight:800;text-align:left;
  padding:14px 15px;margin-bottom:10px;border-radius:var(--radius-sm);cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.06));
  border:3px solid rgba(255,255,255,.26);color:#fff;
  box-shadow:0 4px 0 0 rgba(0,0,0,.24);
  display:flex;align-items:center;gap:11px;transition:transform .12s;
}
.choice:active{transform:translateY(3px)}
.choice .k{
  width:26px;height:26px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  font-size:12px;font-weight:900;color:var(--text-dark);
  background:linear-gradient(180deg,#FFF8E7,#FFE8A8);
}
.choice.ok{background:linear-gradient(180deg,#86EFAC,#22C55E);border-color:#BBF7D0;box-shadow:0 4px 0 0 #15803D;color:#052E16;animation:popa .3s ease}
.choice.ok .k{background:#052E16;color:#BBF7D0}
.choice.no{background:linear-gradient(180deg,#FCA5A5,#EF4444);border-color:#FECACA;box-shadow:0 4px 0 0 #B91C1C;color:#450A0A;animation:shake .34s ease}
.choice.no .k{background:#450A0A;color:#FECACA}
.choice[disabled]{cursor:default;transform:none!important}
.choice.dim{opacity:.4}
@keyframes popa{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.why{
  border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:12px;font-size:13px;line-height:1.55;
  border:3px solid rgba(255,255,255,.24);animation:screenIn .25s ease;font-weight:700;
}
.why.ok{background:linear-gradient(180deg,rgba(74,222,128,.24),rgba(34,197,94,.14));border-color:rgba(134,239,172,.55)}
.why.no{background:linear-gradient(180deg,rgba(248,113,113,.24),rgba(239,68,68,.14));border-color:rgba(252,165,165,.55)}
.why b{display:block;margin-bottom:4px;font-size:13.5px;font-weight:900}
.arab{font-family:var(--arab);font-size:21px;line-height:1.9;direction:rtl;unicode-bidi:isolate}

.streak{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:900;
  padding:5px 11px;border-radius:var(--radius-pill);
  background:linear-gradient(180deg,#FB923C,#EA580C);border:2px solid #FED7AA;color:#fff;
  animation:popa .3s ease;
}

/* ---- LENCANA ---- */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bslot{text-align:center}
.badge{
  width:100%;aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;
  position:relative;font-size:31px;overflow:hidden;
  border:4px solid var(--ring,#fff);
  background:var(--face,#94A3B8);
  box-shadow:0 5px 0 0 rgba(0,0,0,.3), 0 0 18px var(--glow,transparent);
}
.badge::before{content:"";position:absolute;inset:7px;border-radius:50%;border:2px dashed rgba(255,255,255,.45)}
.badge::after{
  content:"";position:absolute;left:-40%;top:-90%;width:60%;height:250%;transform:rotate(22deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
}
.badge>span{position:relative;z-index:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.badge.locked{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18);box-shadow:0 5px 0 0 rgba(0,0,0,.2);font-size:26px}
.badge.locked>span{filter:grayscale(1);opacity:.32}
.badge.locked::after{display:none}
/* min-height tetap supaya nama 2-baris tak sesarkan label tier baris seterusnya */
.bslot .bn{font-size:10.5px;font-weight:800;margin-top:6px;line-height:1.3;min-height:2.6em;display:flex;align-items:center;justify-content:center;text-align:center}
.bslot.off .bn{color:var(--text-muted)}
.bslot .bt{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--gold-light);margin-top:1px}

/* tier lencana */
.t-gangsa{--face:linear-gradient(160deg,#F0B98C,#C77B45 55%,#8B4E22);--ring:#F7D4B4;--glow:rgba(199,123,69,.5)}
.t-perak {--face:linear-gradient(160deg,#FFFFFF,#CBD5E1 55%,#7E8CA0);--ring:#F8FAFC;--glow:rgba(203,213,225,.55)}
.t-emas  {--face:linear-gradient(160deg,#FFF1A8,#F5C542 55%,#B98400);--ring:#FFF8E7;--glow:rgba(245,197,66,.6)}
.t-berlian{--face:linear-gradient(160deg,#CFFAFE,#38BDF8 45%,#6366F1);--ring:#ECFEFF;--glow:rgba(56,189,248,.6)}

/* reveal lencana baharu di skrin keputusan */
.newbadge{display:flex;align-items:center;gap:13px;padding:11px;border-radius:var(--radius-sm);margin-bottom:9px;
  background:linear-gradient(180deg,rgba(245,197,66,.2),rgba(245,197,66,.06));
  border:3px solid rgba(245,197,66,.45);animation:revealIn .45s cubic-bezier(.2,1.4,.4,1) both}
.newbadge .badge{width:56px;flex:0 0 auto}
.newbadge .txt b{display:block;font-size:13.5px;font-weight:900}
.newbadge .txt span{display:block;font-size:11px;color:var(--text-soft);margin-top:2px;font-weight:700}
@keyframes revealIn{from{opacity:0;transform:scale(.7) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}

/* ---- BINTANG ---- */
.stars{font-size:38px;letter-spacing:6px;line-height:1.2}
.stars .s{display:inline-block;animation:starPop .5s cubic-bezier(.2,1.5,.4,1) both}
.stars .s:nth-child(2){animation-delay:.16s}
.stars .s:nth-child(3){animation-delay:.32s}
.stars .off{opacity:.25;filter:grayscale(1)}
@keyframes starPop{from{opacity:0;transform:scale(0) rotate(-45deg)}to{opacity:1;transform:scale(1) rotate(0)}}

/* ---- TOAST ---- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:300;
  background:linear-gradient(180deg,#FFF8E7,#FFE8A8);color:var(--text-dark);
  border:3px solid var(--cream);border-radius:var(--radius-pill);
  padding:10px 18px;font-size:13px;font-weight:800;box-shadow:var(--shadow-card);
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.note{font-size:10.5px;color:var(--text-muted);line-height:1.6;font-weight:600;text-align:center;margin-top:14px}

@media(max-width:340px){
  .logo .l2{font-size:23px}
  .qcard .qtext{font-size:15.5px}
  .badge-grid{gap:9px}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   1) KANDUNGAN — dipisahkan drpd enjin supaya guru/ustaz boleh
      edit teks tanpa sentuh logik. Tambah bab baharu = tambah
      objek dlm SUBJECTS, tiada perubahan kod diperlukan.
      Kurikulum rujukan: KAFA / Sekolah Rendah Agama, Tahun 1.
   ============================================================ */
const SUBJECTS = [
  {id:'adab', ico:'🌸', name:'Adab', color:'#F472B6', bab:[
    {id:'adab-ibubapa', name:'Adab kepada Ibu Bapa'},
    {id:'adab-makan',   name:'Adab Makan & Minum', ready:true, soalan:[
      {emoji:'🤲', q:'Apakah yang kita baca sebelum mula makan?',
       pilihan:['Bismillah','Alhamdulillah','Astaghfirullah'], jawapan:0,
       why:'Sebelum makan kita baca <span class="arab">بِسْمِ اللهِ</span> (Bismillah) — bermaksud "dengan nama Allah".'},

      {emoji:'✋', q:'Tangan yang manakah kita gunakan untuk makan?',
       pilihan:['Tangan kanan','Tangan kiri','Dua-dua tangan serentak'], jawapan:0,
       why:'Nabi Muhammad ﷺ mengajar kita makan dan minum menggunakan tangan kanan.'},

      {emoji:'😋', q:'Apakah yang kita baca selepas habis makan?',
       pilihan:['Alhamdulillah','Bismillah','Insya-Allah'], jawapan:0,
       why:'<span class="arab">الْحَمْدُ لِلّٰهِ</span> (Alhamdulillah) bermaksud segala puji bagi Allah — tanda kita bersyukur diberi makanan.'},

      {emoji:'🧼', q:'Sebelum makan, apakah yang perlu kita lakukan dahulu?',
       pilihan:['Basuh tangan','Terus makan','Main dulu sekejap'], jawapan:0,
       why:'Tangan yang bersih menjaga kesihatan kita. Islam sangat menyukai kebersihan.'},

      {emoji:'🪑', q:'Bagaimanakah cara yang betul semasa makan?',
       pilihan:['Duduk dengan elok','Makan sambil berlari','Makan sambil baring'], jawapan:0,
       why:'Duduk elok di tempat makan supaya kita tidak tercekik dan tidak menumpahkan makanan.'},

      {emoji:'🍚', q:'Ali mengambil nasi yang banyak, tetapi dia buang separuh ke dalam tong sampah. Betul atau salah?',
       pilihan:['Salah, kita tidak boleh membazir','Betul, tidak mengapa','Betul, kalau dia dah kenyang'], jawapan:0,
       why:'Allah tidak suka orang yang membazir. Ambil makanan sedikit dahulu, tambah kemudian jika masih lapar.'},

      {emoji:'🤐', q:'Bolehkah kita bercakap kuat semasa mulut penuh dengan makanan?',
       pilihan:['Tidak boleh','Boleh sahaja','Boleh kalau dengan kawan'], jawapan:0,
       why:'Kunyah dan telan dahulu, kemudian baru bercakap. Itu adab yang sopan dan lebih selamat.'},

      {emoji:'🍽️', q:'Nabi Muhammad ﷺ mengajar kita mengambil makanan dari bahagian yang mana?',

function baseState(){
  return {

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function findSubject(id){ return SUBJECTS.find(s=>s.id===id); }
function findBab(babId){
  for(const s of SUBJECTS){ const b=s.bab.find(x=>x.id===babId); if(b) return {subjek:s, bab:b}; }
  return null;
}
let toastT=null;
function toast(msg){
  const el=$('toast'); el.innerHTML=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1800);
}

/* ---- bunyi ringkas guna WebAudio (tiada fail aset diperlukan) ---- */
let actx=null;
function beep(freqs, dur){
  if(!state.bunyi) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f;
      const t0=actx.currentTime + i*(dur*0.7);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.16,t0+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0+dur+0.02);
    });
  }catch(e){}
}
const sfxBetul =()=>beep([660,880,1175],0.16);
const sfxSalah =()=>beep([220,165],0.20);
const sfxLencana=()=>beep([523,659,784,1047],0.18);

let K=null; // sesi kuiz semasa

function mulaKuiz(babId){
  const f=findBab(babId); if(!f||!f.bab.ready) return;
  K={
    babId, subjek:f.subjek, bab:f.bab,
    soalan: shuffle(f.bab.soalan).map(s=>{
      const betulTeks = s.pilihan[s.jawapan];
      const pilihan = shuffle(s.pilihan);
      return {emoji:s.emoji, q:s.q, why:s.why, pilihan, jawapan: pilihan.indexOf(betulTeks)};
    }),
    idx:0, betul:0, rentetan:0, rentetanTerbaik:0, pantas:0,
    dijawab:false, mulaSoalan:0,
  };
  soalanSemasa();
}

function soalanSemasa(){
  const s=K.soalan[K.idx];
  const no=K.idx+1, jumlah=K.soalan.length;
  K.dijawab=false; K.mulaSoalan=Date.now();

  const pilihan=s.pilihan.map((p,i)=>
    `<button class="choice" id="c${i}" onclick="AG.jawab(${i})">
       <span class="k">${'ABC'[i]||i+1}</span><span>${esc(p)}</span>
     </button>`).join('');

  render(`${topbar('<button class="iconbtn" onclick="AG.keluarKuiz()">←</button>')}
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
      <div style="flex:1"><div class="pbar"><i style="width:${Math.round((K.idx)/jumlah*100)}%"></i></div></div>
      <div style="font-size:11.5px;font-weight:900;color:var(--gold-light);white-space:nowrap">${no}/${jumlah}</div>
    </div>
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px;min-height:26px">
      <div style="font-size:10.5px;font-weight:800;letter-spacing:1.5px;color:var(--text-muted)">${esc(K.bab.name.toUpperCase())}</div>
      <div style="flex:1"></div>
      ${K.rentetan>=2?`<span class="streak">🔥 ${K.rentetan} BERTURUT</span>`:''}
    </div>
    <div class="qcard">
      <span class="qemoji">${s.emoji}</span>
      <div class="qtext">${esc(s.q)}</div>
    </div>
    <div id="pilihan">${pilihan}</div>
    <div id="maklumbalas"></div>
  `);
}

function jawab(i){
  if(K.dijawab) return;
  K.dijawab=true;
  const s=K.soalan[K.idx];
  const betul = i===s.jawapan;
  const masa = (Date.now()-K.mulaSoalan)/1000;

  // matikan semua butang, tandakan jawapan
  s.pilihan.forEach((_,n)=>{
    const el=$('c'+n); if(!el) return;
    el.disabled=true; el.setAttribute('onclick','');
    if(n===s.jawapan) el.classList.add('ok');
    else if(n===i) el.classList.add('no');
    else el.classList.add('dim');
  });

  if(betul){
    K.betul++; K.rentetan++;
    K.rentetanTerbaik=Math.max(K.rentetanTerbaik,K.rentetan);
    if(masa<5) K.pantas++;
    sfxBetul();
  }else{
    K.rentetan=0;
    sfxSalah();
  }

  const akhir = K.idx>=K.soalan.length-1;
  $('maklumbalas').innerHTML=`
    <div class="why ${betul?'ok':'no'}">
      <b>${betul?'✅ Betul!':'❌ Belum tepat'}</b>
      ${betul?'':`<div style="margin-bottom:5px">Jawapan yang betul: <b>${esc(s.pilihan[s.jawapan])}</b></div>`}
      <div>${s.why}</div>
    </div>
    <button class="btn btn-cta" onclick="AG.seterusnya()">${akhir?'LIHAT KEPUTUSAN 🏁':'SOALAN SETERUSNYA →'}</button>`;
  $('maklumbalas').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function seterusnya(){
  if(K.idx>=K.soalan.length-1) return tamatKuiz();
  K.idx++; soalanSemasa();
}

function keluarKuiz(){
  if(!confirm('Keluar dari kuiz? Jawapan kamu tidak akan disimpan.')) return;
  const sid = K ? findBab(K.babId).subjek.id : 'adab'; // baca subjek dulu sebelum K dibuang
  K=null; subjek(sid);
}

/* ---- kira bintang: 9-10 = 3, 7-8 = 2, 5-6 = 1 ---- */
function kiraBintang(betul, jumlah){
  const p=betul/jumlah;
  if(p>=0.9) return 3;
  if(p>=0.7) return 2;
  if(p>=0.5) return 1;
  return 0;
}

function tamatKuiz(){
  const jumlah=K.soalan.length;
  const bintang=kiraBintang(K.betul,jumlah);
  const lama=state.skor[K.babId];
  const naikSkor = !!(lama && K.betul>lama.betul);

  // bintang dikira sebagai peningkatan terbaik sahaja (tak boleh farm ulang)
  const bintangLama = lama ? lama.bintang : 0;
  if(bintang>bintangLama) state.bintang += (bintang-bintangLama);
  if(!lama || K.betul>lama.betul || bintang>bintangLama){
    state.skor[K.babId]={betul:Math.max(K.betul, lama?lama.betul:0), jumlah, bintang:Math.max(bintang,bintangLama)};
  }
  state.kuizSiap++;

  const r={babId:K.babId, betul:K.betul, jumlah, bintang, rentetanTerbaik:K.rentetanTerbaik, pantas:K.pantas, naikSkor};
  const baharu=[];
  BADGES.forEach(b=>{
    if(state.lencana[b.id]) return;
    let lulus=false;
    try{ lulus=!!b.test(r,state); }catch(e){ lulus=false; }
    if(lulus){ state.lencana[b.id]=Date.now(); baharu.push(b); }
  });
  save();

  if(baharu.length) setTimeout(sfxLencana,320);
  keputusan(r,baharu);
}

      <div style="font-size:9.5px;font-weight:900;letter-spacing:.6px;color:${ada?'var(--gold-light)':'var(--text-muted)'}">${ada?'DAPAT':'BELUM'}</div>
    </div>`;
  }).join('');

  render(`${topbar('<button class="iconbtn" onclick="AG.home()">←</button>')}
    <div class="panel" style="text-align:center">
      <div style="font-size:11px;letter-spacing:2.5px;font-weight:800;color:var(--text-muted)">ALBUM LENCANA</div>
      <div style="font-size:22px;font-weight:900;color:var(--gold-light);margin:4px 0 10px">${dimiliki} / ${BADGES.length}</div>
      <div class="pbar"><i style="width:${Math.round(dimiliki/BADGES.length*100)}%"></i></div>
    </div>
    <div class="panel"><div class="badge-grid">${grid}</div></div>
    <div class="section-label">📋 CARA DAPAT</div>
    <div class="panel" style="padding:6px 14px 12px">${senarai}</div>
  `);
}

/* ============================================================
   6) TETAPAN
   ============================================================ */
function tetapan(){
  render(`${topbar('<button class="iconbtn" onclick="AG.home()">←</button>')}
    <div class="panel">
      <div class="section-label" style="margin-top:0">⚙️ TETAPAN</div>
      <button class="btn btn-secondary" onclick="AG.togglBunyi()">${state.bunyi?'🔊 BUNYI: HIDUP':'🔇 BUNYI: MATI'}</button>
      <button class="btn btn-secondary" style="margin-top:9px" onclick="AG.reset()">🗑️ RESET SEMUA PROGRES</button>
    </div>
    <div class="panel">
      <div class="section-label" style="margin-top:0">ℹ️ TENTANG</div>
      <div style="font-size:12px;line-height:1.7;color:var(--text-soft)">
        Kuiz interaktif Sekolah Agama Tahun 1 berdasarkan kurikulum KAFA / Sekolah Rendah Agama.
        Versi ini ialah <b>prototaip</b> dengan satu bab sedia dimainkan
        (Adab: Adab Makan &amp; Minum) untuk menilai rupa dan rasa aplikasi.
        <br><br>
        <b style="color:var(--gold-light)">Nota penting:</b> kandungan dihadkan kepada perkara asas yang disepakati.
        Sila dapatkan semakan guru atau ustaz sebelum digunakan di dalam kelas.
      </div>
    </div>
  `);
}
function togglBunyi(){ state.bunyi=!state.bunyi; save(); tetapan(); toast(state.bunyi?'🔊 Bunyi dihidupkan':'🔇 Bunyi dimatikan'); }
function reset(){
  if(!confirm('Padam semua bintang dan lencana? Tindakan ini tidak boleh dibatalkan.')) return;
  state=baseState(); save(); home(); toast('Progres telah direset');
}

/* ============================================================
   7) BOOT
   ============================================================ */
const AG={home, subjek, mulaKuiz, jawab, seterusnya, keluarKuiz, album, tetapan, togglBunyi, reset};
window.AG=AG;
load();
home();
</script>
