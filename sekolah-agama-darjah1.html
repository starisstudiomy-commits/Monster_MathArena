<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agama D1">
<meta name="theme-color" content="#0B4F3F">
<title>e-Learning Sekolah Agama — Darjah 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   e-LEARNING SEKOLAH AGAMA — DARJAH 1
   Rujukan silabus: Sekolah Agama Kerajaan Negeri Johor
   6 subjek: Tauhid, Sirah, Akhlak, Arab, Ibadat, Jawi

   Konsep: murid jawab soalan, dapat markah. Tiada permainan,
   tiada lawan monster, tiada lencana — fokus pada pencapaian
   markah setiap pelajaran supaya guru/ibu bapa boleh pantau.
   ============================================================ */
:root{
  --font:"Fredoka","Nunito","Scheherazade New",system-ui,sans-serif;
  --read:"Nunito",system-ui,sans-serif;
  --arab:"Scheherazade New",serif;

  --bg-deep:#062D24;
  --bg-mid:#0B4F3F;
  --panel-a:#12705A;
  --panel-b:#0C5544;

  --gold:#F5C542;
  --gold-light:#FFE066;
  --gold-deep:#C99200;
  --cream:#FFF4D6;

  --text:#FFFFFF;
  --text-soft:#CDEBE0;
  --text-muted:#8FBFAE;
  --text-dark:#0A3A2E;

  --green:#4ADE80;
  --red:#F87171;

  --radius:20px;
  --radius-sm:15px;
  --radius-pill:999px;
  --shadow-card:0 5px 0 0 rgba(0,0,0,.2), 0 10px 24px rgba(0,0,0,.26);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;touch-action:manipulation}
/* JANGAN letak height:100% pada body bersama overflow-x:hidden — body akan jadi
   scroll container setinggi viewport & kandungan panjang tak boleh ditatal. */
html,body{overflow-x:hidden}
body{
  font-family:var(--font);font-weight:600;color:var(--text);
  background:var(--bg-deep);min-height:100dvh;
  overscroll-behavior-x:none;user-select:none;-webkit-user-select:none;
}

#bg{
  position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse 90% 60% at 50% -10%, rgba(74,222,128,.24), transparent 55%),
    radial-gradient(ellipse 70% 50% at 100% 85%, rgba(245,197,66,.12), transparent 50%),
    linear-gradient(180deg,#0B4F3F 0%,#083A2F 45%,#052019 100%);
}
#bg::before{
  content:"";position:absolute;inset:0;opacity:.13;pointer-events:none;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.5) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.5) 0 1px, transparent 1px 34px);
}

#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:12px 12px calc(26px + env(safe-area-inset-bottom));position:relative}
.screen{animation:screenIn .25s ease}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.panel{
  background:linear-gradient(180deg,var(--panel-a) 0%,var(--panel-b) 100%);
  border:3px solid rgba(255,255,255,.15);
  border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow-card);margin-bottom:12px;
}

/* ---- BUTANG ---- */
.btn{
  font-family:var(--font);font-weight:700;font-size:14px;
  color:var(--text-dark);border:none;border-radius:var(--radius-sm);
  padding:14px 18px;cursor:pointer;width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s ease;letter-spacing:.3px;
}
.btn:active{transform:translateY(3px)}
.btn-primary{
  background:linear-gradient(180deg,#FFE066 0%,#F5C542 45%,#E0A800 100%);
  color:var(--text-dark);border:3px solid var(--cream);
  box-shadow:0 5px 0 0 var(--gold-deep), inset 0 2px 0 rgba(255,255,255,.5);
}
.btn-primary:active{box-shadow:0 2px 0 0 var(--gold-deep)}
.btn-secondary{
  background:linear-gradient(180deg,rgba(255,255,255,.19),rgba(255,255,255,.08));
  border:3px solid rgba(255,255,255,.26);color:#fff;
  box-shadow:0 4px 0 0 rgba(0,0,0,.2);
}
.btn-sm{font-size:12px;padding:10px 14px;border-radius:13px}

/* ---- TOPBAR ---- */
.topbar{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pill{
  background:linear-gradient(180deg,#FFF8E7 0%,#FFE8A8 100%);
  border:2.5px solid var(--cream);border-radius:var(--radius-pill);
  padding:6px 12px;font-weight:800;font-size:12px;
  display:flex;align-items:center;gap:5px;color:var(--text-dark);
  box-shadow:0 3px 0 0 rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.7);
  white-space:nowrap;
}
.iconbtn{
  width:40px;height:40px;flex:0 0 auto;border-radius:13px;font-size:17px;padding:0;
  background:linear-gradient(180deg,#FFF8E7 0%,#FFE8A8 100%);
  border:2.5px solid var(--cream);color:var(--text-dark);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 0 rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .12s;
}
.iconbtn:active{transform:translateY(2px)}

/* ---- KEPALA ---- */
.head{text-align:center;margin:6px 0 4px;line-height:1.1}
.head .l1{font-size:12px;font-weight:700;letter-spacing:4px;color:var(--gold-light);display:block;margin-bottom:5px}
.head .l2{font-size:25px;font-weight:700;display:block;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.subtitle{color:var(--text-soft);text-align:center;margin:7px 0 15px;font-size:11.5px;font-weight:600;letter-spacing:.8px;font-family:var(--read)}
.section-label{font-size:11px;letter-spacing:2.2px;font-weight:800;color:var(--gold-light);margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.section-label::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,rgba(245,197,66,.45),transparent);border-radius:2px}

/* ---- SENARAI SUBJEK ---- */
.subj{
  display:flex;align-items:center;gap:12px;padding:13px;border-radius:var(--radius-sm);
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  border:3px solid rgba(255,255,255,.16);box-shadow:0 4px 0 0 rgba(0,0,0,.2);
  margin-bottom:9px;cursor:pointer;transition:transform .12s;
}
.subj:active{transform:translateY(3px)}
.subj .ico{
  width:46px;height:46px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  font-size:21px;color:#fff;border:3px solid rgba(255,255,255,.5);
  font-family:var(--arab);line-height:1;
}
.subj .t{flex:1;min-width:0}
.subj .t b{display:block;font-size:15px;font-weight:700;letter-spacing:.4px}
.subj .t span{display:block;font-size:10.5px;color:var(--text-muted);margin-top:3px;font-weight:700;font-family:var(--read)}
.subj .sk{
  flex:0 0 auto;text-align:right;font-family:var(--read);
}
.subj .sk b{display:block;font-size:15px;font-weight:900;color:var(--gold-light)}
.subj .sk span{display:block;font-size:9px;color:var(--text-muted);font-weight:800;letter-spacing:.5px}

/* ---- SENARAI PELAJARAN ---- */
.pel{
  display:flex;align-items:center;gap:11px;padding:12px;border-radius:var(--radius-sm);
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  border:3px solid rgba(255,255,255,.16);box-shadow:0 4px 0 0 rgba(0,0,0,.2);
  margin-bottom:9px;cursor:pointer;transition:transform .12s;
}
.pel:active{transform:translateY(3px)}
.pel .n{
  width:34px;height:34px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;
  font-size:13px;font-weight:800;color:var(--text-dark);
  background:linear-gradient(180deg,#FFF8E7,#FFE8A8);border:2px solid var(--cream);
  font-family:var(--read);
}
.pel .t{flex:1;min-width:0}
.pel .t b{display:block;font-size:13.5px;font-weight:700}
.pel .t span{display:block;font-size:10.5px;color:var(--text-muted);margin-top:2px;font-weight:700;font-family:var(--read)}
.pel .mk{flex:0 0 auto;font-size:12px;font-weight:900;font-family:var(--read);color:var(--gold-light)}

/* ---- BAR PROGRES ---- */
.pbar{height:11px;border-radius:var(--radius-pill);background:rgba(0,0,0,.3);overflow:hidden;border:2px solid rgba(255,255,255,.16)}
.pbar>i{display:block;height:100%;border-radius:var(--radius-pill);background:linear-gradient(180deg,#FFE066,#E0A800);transition:width .35s ease}

/* ---- KUIZ ---- */
.qcard{
  background:linear-gradient(180deg,#FFF8E7 0%,#FFE8A8 100%);
  border:4px solid var(--cream);border-radius:var(--radius);
  padding:20px 16px;text-align:center;color:var(--text-dark);
  box-shadow:var(--shadow-card);margin-bottom:14px;
}
.qcard .qno{font-size:10px;font-weight:900;letter-spacing:2px;color:#0A3A2E;opacity:.55;font-family:var(--read)}
.qcard .qtext{font-size:16.5px;font-weight:700;line-height:1.5;margin-top:7px}
.qcard .qar{font-family:var(--arab);font-size:34px;line-height:1.8;direction:rtl;unicode-bidi:isolate;margin-top:9px;font-weight:700}

.choice{
  width:100%;font-family:var(--font);font-size:14.5px;font-weight:700;text-align:left;
  padding:13px 15px;margin-bottom:9px;border-radius:var(--radius-sm);cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  border:3px solid rgba(255,255,255,.24);color:#fff;
  box-shadow:0 4px 0 0 rgba(0,0,0,.22);
  display:flex;align-items:center;gap:11px;transition:transform .12s;
}
.choice:active{transform:translateY(3px)}
.choice .k{
  width:25px;height:25px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;
  font-size:12px;font-weight:900;color:var(--text-dark);font-family:var(--read);
  background:linear-gradient(180deg,#FFF8E7,#FFE8A8);
}
.choice.ar .v{font-family:var(--arab);font-size:22px;direction:rtl;unicode-bidi:isolate;line-height:1.7}
.choice.ok{background:linear-gradient(180deg,#86EFAC,#22C55E);border-color:#BBF7D0;box-shadow:0 4px 0 0 #15803D;color:#052E16}
.choice.ok .k{background:#052E16;color:#BBF7D0}
.choice.no{background:linear-gradient(180deg,#FCA5A5,#EF4444);border-color:#FECACA;box-shadow:0 4px 0 0 #B91C1C;color:#450A0A;animation:shake .32s ease}
.choice.no .k{background:#450A0A;color:#FECACA}
.choice[disabled]{cursor:default;transform:none!important}
.choice.dim{opacity:.38}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.why{
  border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:11px;font-size:13px;line-height:1.6;
  border:3px solid rgba(255,255,255,.22);animation:screenIn .22s ease;font-weight:600;font-family:var(--read);
}
.why.ok{background:linear-gradient(180deg,rgba(74,222,128,.22),rgba(34,197,94,.12));border-color:rgba(134,239,172,.5)}
.why.no{background:linear-gradient(180deg,rgba(248,113,113,.22),rgba(239,68,68,.12));border-color:rgba(252,165,165,.5)}
.why b.h{display:block;margin-bottom:5px;font-size:13.5px;font-weight:900}
.arab{font-family:var(--arab);font-size:20px;line-height:1.9;direction:rtl;unicode-bidi:isolate}

/* ---- KEPUTUSAN ---- */
.gred{
  width:104px;height:104px;margin:4px auto 0;border-radius:50%;display:grid;place-items:center;
  font-size:44px;font-weight:900;font-family:var(--read);color:var(--text-dark);
  border:5px solid var(--cream);box-shadow:0 5px 0 0 rgba(0,0,0,.25);
  animation:gredIn .45s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes gredIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.g-A{background:linear-gradient(160deg,#FFF1A8,#F5C542 55%,#B98400)}
.g-B{background:linear-gradient(160deg,#BBF7D0,#4ADE80 55%,#15803D)}
.g-C{background:linear-gradient(160deg,#BFDBFE,#60A5FA 55%,#1D4ED8);color:#fff}
.g-D{background:linear-gradient(160deg,#FED7AA,#FB923C 55%,#C2410C);color:#fff}

.markah-besar{font-size:40px;font-weight:900;font-family:var(--read);color:var(--gold-light);line-height:1}
.markah-besar span{font-size:19px;color:var(--text-soft)}

/* ---- LAPORAN ---- */
.lap-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.lap-row:last-child{border-bottom:none}
.lap-row .t{flex:1;min-width:0}
.lap-row .t b{display:block;font-size:12.5px;font-weight:700}
.lap-row .t span{display:block;font-size:10px;color:var(--text-muted);margin-top:1px;font-weight:700;font-family:var(--read)}
.lap-row .m{font-size:13px;font-weight:900;font-family:var(--read);color:var(--gold-light);white-space:nowrap}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:300;
  background:linear-gradient(180deg,#FFF8E7,#FFE8A8);color:var(--text-dark);
  border:3px solid var(--cream);border-radius:var(--radius-pill);
  padding:10px 18px;font-size:13px;font-weight:800;box-shadow:var(--shadow-card);
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.note{font-size:10.5px;color:var(--text-muted);line-height:1.65;font-weight:600;text-align:center;margin-top:14px;font-family:var(--read)}
.kosong{font-size:12px;color:var(--text-muted);text-align:center;padding:18px 10px;line-height:1.6;font-family:var(--read);font-weight:600}

@media(max-width:340px){
  .head .l2{font-size:21px}
  .qcard .qtext{font-size:15px}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   1) KANDUNGAN
   ------------------------------------------------------------
   Silabus rujukan: Sekolah Agama Kerajaan Negeri Johor, Darjah 1.
   `julat` = julat pelajaran rasmi seperti dalam sukatan.

   PENTING — medan `no` (nombor pelajaran spt "1.1") sengaja
   dibiarkan null. Julat dalam sukatan hanya menunjukkan mula &
   akhir, bukan senarai penuh, dan senarai tajuk sebenar tidak
   dapat disahkan dari sumber terbuka. Isi `no` selepas merujuk
   halaman ISI KANDUNGAN kitab supaya penomboran tepat.

   Setiap soalan:
     q        - teks soalan (Melayu)
     qar      - teks Arab/Jawi besar di bawah soalan (pilihan)
     pilihan  - array jawapan, indeks 0 = jawapan betul
     ar       - true jika pilihan ditulis dalam tulisan Arab/Jawi
     why      - penjelasan ringkas selepas murid menjawab
   ============================================================ */
const SUBJECTS = [
  {id:'tauhid', nama:'Tauhid', ico:'ﷲ', warna:'#4ADE80', julat:'Pelajaran 1.1 – 6.5', pelajaran:[
    {id:'th-rukuniman', no:null, tajuk:'Rukun Iman', soalan:[
      {q:'Berapakah bilangan Rukun Iman?', pilihan:['Enam','Lima','Empat'],
       why:'Rukun Iman ada <b>enam</b> perkara yang wajib kita percaya.'},
      {q:'Apakah Rukun Iman yang pertama?', pilihan:['Beriman kepada Allah','Beriman kepada Malaikat','Beriman kepada Rasul'],
       why:'Rukun Iman pertama ialah beriman kepada Allah — percaya bahawa Allah itu Esa dan Tuhan yang menciptakan segala sesuatu.'},
      {q:'Apakah Rukun Iman yang kedua?', pilihan:['Beriman kepada Malaikat','Beriman kepada Kitab','Beriman kepada Hari Akhirat'],
       why:'Rukun Iman kedua ialah beriman kepada malaikat-malaikat Allah.'},
      {q:'Apakah maksud perkataan "iman"?', pilihan:['Percaya','Bersih','Berdoa'],
       why:'Iman bermaksud <b>percaya</b> dengan hati, diucap dengan lisan dan dibuktikan dengan amalan.'},
      {q:'Malaikat diciptakan oleh Allah daripada apa?', pilihan:['Cahaya (nur)','Tanah','Api'],
       why:'Malaikat dicipta daripada cahaya, manusia daripada tanah, dan iblis daripada api.'},
      {q:'Beriman kepada kitab-kitab Allah adalah Rukun Iman yang ke berapa?', pilihan:['Ketiga','Pertama','Keenam'],
       why:'Rukun Iman ketiga ialah beriman kepada kitab-kitab yang diturunkan oleh Allah.'},
      {q:'Kitab yang diturunkan kepada Nabi Muhammad ﷺ ialah?', pilihan:['Al-Quran','Taurat','Injil'],
       why:'Al-Quran diturunkan kepada Nabi Muhammad ﷺ sebagai kitab yang terakhir dan panduan hidup kita.'},
      {q:'Apakah Rukun Iman yang keempat?', pilihan:['Beriman kepada Rasul-rasul','Beriman kepada Malaikat','Beriman kepada Qada dan Qadar'],
       why:'Rukun Iman keempat ialah beriman kepada rasul-rasul yang diutuskan oleh Allah.'},
      {q:'Apakah Rukun Iman yang kelima?', pilihan:['Beriman kepada Hari Akhirat','Beriman kepada Allah','Beriman kepada Kitab'],
       why:'Rukun Iman kelima ialah beriman kepada Hari Akhirat — hari pembalasan bagi setiap amalan kita.'},
      {q:'Apakah Rukun Iman yang keenam dan terakhir?', pilihan:['Beriman kepada Qada dan Qadar','Beriman kepada Rasul','Beriman kepada Malaikat'],
       why:'Rukun Iman keenam ialah beriman kepada Qada dan Qadar, iaitu ketentuan Allah ke atas setiap makhluk.'},
    ]},
    {id:'th-rukunislam', no:null, tajuk:'Rukun Islam', soalan:[
      {q:'Berapakah bilangan Rukun Islam?', pilihan:['Lima','Enam','Empat'],
       why:'Rukun Islam ada <b>lima</b> perkara.'},
      {q:'Apakah Rukun Islam yang pertama?', pilihan:['Mengucap dua kalimah syahadah','Mendirikan solat','Berpuasa'],
       why:'Rukun Islam pertama ialah mengucap dua kalimah syahadah sebagai pengakuan kita seorang Islam.'},
      {q:'Apakah Rukun Islam yang kedua?', pilihan:['Mendirikan solat','Menunaikan zakat','Mengerjakan haji'],
       why:'Rukun Islam kedua ialah mendirikan solat lima waktu setiap hari.'},
      {q:'Apakah Rukun Islam yang ketiga?', pilihan:['Menunaikan zakat','Berpuasa di bulan Ramadan','Mengucap syahadah'],
       why:'Rukun Islam ketiga ialah menunaikan zakat kepada mereka yang berhak menerimanya.'},
      {q:'Apakah Rukun Islam yang keempat?', pilihan:['Berpuasa di bulan Ramadan','Mengerjakan haji','Mendirikan solat'],
       why:'Rukun Islam keempat ialah berpuasa pada bulan Ramadan.'},
      {q:'Apakah Rukun Islam yang kelima?', pilihan:['Mengerjakan haji bagi yang berkemampuan','Menunaikan zakat','Berpuasa'],
       why:'Rukun Islam kelima ialah mengerjakan haji ke Baitullah bagi yang berkemampuan.'},
      {q:'Berapa kali kita menunaikan solat fardu dalam sehari semalam?', pilihan:['Lima kali','Tiga kali','Enam kali'],
       why:'Solat fardu ialah lima waktu sehari semalam: Subuh, Zohor, Asar, Maghrib dan Isyak.'},
      {q:'Umat Islam wajib berpuasa pada bulan apa?', pilihan:['Ramadan','Syawal','Rejab'],
       why:'Puasa wajib dilakukan sepanjang bulan Ramadan.'},
      {q:'Ibadah haji dikerjakan di kota mana?', pilihan:['Mekah','Madinah','Baitulmaqdis'],
       why:'Haji dikerjakan di Mekah, iaitu di Baitullah (Kaabah) dan tempat-tempat berhampiran.'},
      {q:'Apakah bunyi kalimah syahadah yang pertama?', qar:'أَشْهَدُ أَنْ لَا إِلٰهَ إِلَّا اللهُ',
       pilihan:['Tiada Tuhan melainkan Allah','Muhammad itu pesuruh Allah','Allah Maha Besar'],
       why:'Kalimah syahadah pertama bermaksud "Aku bersaksi bahawa tiada Tuhan melainkan Allah".'},
    ]},
  ]},

  {id:'sirah', nama:'Sirah', ico:'🕌', warna:'#60A5FA', julat:'Pelajaran 1.1 – 3.2', pelajaran:[
    {id:'sr-kelahiran', no:null, tajuk:'Kelahiran Nabi Muhammad ﷺ', soalan:[
      {q:'Nabi Muhammad ﷺ dilahirkan di kota mana?', pilihan:['Mekah','Madinah','Taif'],
       why:'Nabi Muhammad ﷺ dilahirkan di kota Mekah.'},
      {q:'Nabi Muhammad ﷺ dilahirkan pada hari apa?', pilihan:['Isnin','Jumaat','Ahad'],
       why:'Baginda dilahirkan pada hari Isnin, 12 Rabiulawal.'},
      {q:'Nabi Muhammad ﷺ dilahirkan pada bulan apa?', pilihan:['Rabiulawal','Ramadan','Syawal'],
       why:'Baginda dilahirkan pada bulan Rabiulawal.'},

      {q:'Apakah tulisan Jawi bagi perkataan "emak"?',

/* ============================================================
   2) STATE & SIMPANAN
   ============================================================ */
const SAVE_KEY='agama_d1_v2';
let state=null;

function baseState(){
  return {
    v:2,
    nama:'',            // nama murid (pilihan)
    markah:{},          // pelajaranId -> {betul, jumlah, peratus, cubaan, terakhir}
    bunyi:true,
  };
}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    state = raw ? Object.assign(baseState(), JSON.parse(raw)) : baseState();
  }catch(e){ state=baseState(); }
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }

/* ---- util ---- */
const $=(id)=>document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function cariSubjek(id){ return SUBJECTS.find(s=>s.id===id); }
function cariPelajaran(pid){
  for(const s of SUBJECTS){ const p=s.pelajaran.find(x=>x.id===pid); if(p) return {subjek:s, pelajaran:p}; }
  return null;
}
function semuaPelajaran(){ return SUBJECTS.flatMap(s=>s.pelajaran.map(p=>({subjek:s,pelajaran:p}))); }

let toastT=null;
function toast(msg){
  const el=$('toast'); el.innerHTML=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1800);
}

/* ---- bunyi ringkas guna WebAudio (tiada fail aset diperlukan) ---- */
let actx=null;
function beep(freqs, dur){
  if(!state.bunyi) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f;
      const t0=actx.currentTime + i*(dur*0.7);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.14,t0+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0+dur+0.02);
    });
  }catch(e){}
}
const sfxBetul=()=>beep([660,880],0.15);
const sfxSalah=()=>beep([220,165],0.19);

/* ---- gred ---- */
function gredBagi(peratus){
  if(peratus>=80) return {g:'A', kata:'Cemerlang'};
  if(peratus>=60) return {g:'B', kata:'Baik'};
  if(peratus>=40) return {g:'C', kata:'Sederhana'};
  return {g:'D', kata:'Perlu Ulang Kaji'};
}

/* ============================================================
   3) SKRIN
   ============================================================ */
function render(html){ $('app').innerHTML='<div class="screen">'+html+'</div>'; window.scrollTo(0,0); }

function topbar(kiri){
  return `<div class="topbar">
    ${kiri||''}
    <div style="flex:1"></div>
    <button class="iconbtn" onclick="EL.laporan()" title="Laporan Markah">📊</button>
    <button class="iconbtn" onclick="EL.tetapan()" title="Tetapan">⚙️</button>
  </div>`;
}

/* markah terbaik bagi satu subjek: purata peratus pelajaran yang dah dijawab */
function ringkasanSubjek(s){
  const dijawab=s.pelajaran.filter(p=>state.markah[p.id]);
  if(!dijawab.length) return null;
  const purata=Math.round(dijawab.reduce((j,p)=>j+state.markah[p.id].peratus,0)/dijawab.length);
  return {bil:dijawab.length, jumlah:s.pelajaran.length, purata};
}

function home(){
  const senarai=SUBJECTS.map(s=>{
    const r=ringkasanSubjek(s);
    return `<div class="subj" onclick="EL.subjek('${s.id}')">
      <div class="ico" style="background:${s.warna}33;border-color:${s.warna}">${s.ico}</div>
      <div class="t">
        <b style="color:${s.warna}">${esc(s.nama)}</b>
        <span>${esc(s.julat)}</span>
      </div>
      <div class="sk">
        ${r?`<b>${r.purata}%</b><span>${r.bil}/${r.jumlah} PELAJARAN</span>`
           :`<b style="color:var(--text-muted)">—</b><span>BELUM MULA</span>`}
      </div>
    </div>`;
  }).join('');

  const sudah=Object.keys(state.markah).length;
  const jumlahPel=semuaPelajaran().length;
  const purataAll = sudah ? Math.round(Object.values(state.markah).reduce((j,m)=>j+m.peratus,0)/sudah) : 0;

  render(`${topbar()}
    <div class="head"><span class="l1">SEKOLAH AGAMA</span><span class="l2">DARJAH 1</span></div>
    <div class="subtitle">Jawab soalan · Kumpul markah</div>

    <div class="panel" style="text-align:center;padding:15px">
      <div style="font-size:10.5px;letter-spacing:2px;font-weight:800;color:var(--text-muted)">MARKAH KESELURUHAN</div>
      <div class="markah-besar" style="margin-top:6px">${purataAll}<span>%</span></div>
      <div style="font-size:11px;color:var(--text-soft);margin:8px 0 9px;font-family:var(--read)">
        ${sudah} daripada ${jumlahPel} pelajaran telah dijawab
      </div>
      <div class="pbar"><i style="width:${Math.round(sudah/jumlahPel*100)}%"></i></div>
    </div>

    <div class="section-label">📚 SUBJEK</div>
    ${senarai}

    <button class="btn btn-secondary" style="margin-top:6px" onclick="EL.laporan()">📊 LIHAT LAPORAN MARKAH</button>
    <div class="note">Silabus rujukan: Sekolah Agama Kerajaan Negeri Johor<br>Kandungan perlu disemak oleh guru sebelum digunakan di dalam kelas.</div>
  `);
}

function subjek(id){
  const s=cariSubjek(id); if(!s) return home();
  const senarai=s.pelajaran.map((p,i)=>{
    const m=state.markah[p.id];
    return `<div class="pel" onclick="EL.mula('${p.id}')">
      <div class="n">${p.no||(i+1)}</div>
      <div class="t">
        <b>${esc(p.tajuk)}</b>
        <span>${p.soalan.length} soalan${m?` · ${m.cubaan} kali cuba`:' · belum dijawab'}</span>
      </div>
      <div class="mk">${m?`${m.peratus}%`:'▶'}</div>
    </div>`;
  }).join('');

  render(`${topbar(`<button class="iconbtn" onclick="EL.home()">←</button>`)}
    <div class="panel" style="text-align:center;padding:17px">
      <div class="ico" style="width:56px;height:56px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:25px;font-family:var(--arab);background:${s.warna}33;border:3px solid ${s.warna}">${s.ico}</div>
      <div style="font-size:20px;font-weight:700;color:${s.warna};margin-top:8px">${esc(s.nama)}</div>
      <div style="font-size:11px;color:var(--text-soft);margin-top:3px;font-family:var(--read)">${esc(s.julat)}</div>
    </div>
    <div class="section-label">📖 PELAJARAN</div>
    ${senarai}
    <div class="note">Pelajaran lain akan ditambah setelah senarai tajuk penuh<br>daripada halaman isi kandungan kitab diperoleh.</div>
  `);
}

/* ============================================================
   4) KUIZ
   ============================================================ */
let K=null;

function mula(pid){
  const f=cariPelajaran(pid); if(!f) return;
  K={
    pid, subjek:f.subjek, pelajaran:f.pelajaran,
    soalan: shuffle(f.pelajaran.soalan).map(s=>{
      const betulTeks=s.pilihan[0];           // indeks 0 sentiasa jawapan betul dlm data
      const pilihan=shuffle(s.pilihan);
      return {...s, pilihan, jawapan:pilihan.indexOf(betulTeks)};
    }),
    idx:0, betul:0, dijawab:false,
  };
  soalan();
}

function soalan(){
  const s=K.soalan[K.idx], no=K.idx+1, jum=K.soalan.length;
  K.dijawab=false;

  const pilihan=s.pilihan.map((p,i)=>
    `<button class="choice ${s.ar?'ar':''}" id="c${i}" onclick="EL.jawab(${i})">
       <span class="k">${'ABCD'[i]||i+1}</span><span class="v">${esc(p)}</span>
     </button>`).join('');

  render(`${topbar(`<button class="iconbtn" onclick="EL.keluar()">←</button>`)}
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:9px">
      <div style="flex:1"><div class="pbar"><i style="width:${Math.round(K.idx/jum*100)}%"></i></div></div>
      <div style="font-size:11.5px;font-weight:900;color:var(--gold-light);white-space:nowrap;font-family:var(--read)">${no}/${jum}</div>
    </div>
    <div style="font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:var(--text-muted);margin-bottom:9px;font-family:var(--read)">
      ${esc(K.subjek.nama.toUpperCase())} · ${esc(K.pelajaran.tajuk.toUpperCase())}
    </div>
    <div class="qcard">
      <div class="qno">SOALAN ${no}</div>
      <div class="qtext">${esc(s.q)}</div>
      ${s.qar?`<div class="qar">${s.qar}</div>`:''}
    </div>
    <div>${pilihan}</div>
    <div id="maklumbalas"></div>
  `);
}

function jawab(i){
  if(K.dijawab) return;
  K.dijawab=true;
  const s=K.soalan[K.idx], betul = i===s.jawapan;

  s.pilihan.forEach((_,n)=>{
    const el=$('c'+n); if(!el) return;
    el.disabled=true; el.onclick=null;
    if(n===s.jawapan) el.classList.add('ok');
    else if(n===i) el.classList.add('no');
    else el.classList.add('dim');
  });

  if(betul){ K.betul++; sfxBetul(); } else { sfxSalah(); }

  const akhir=K.idx>=K.soalan.length-1;
  $('maklumbalas').innerHTML=`
    <div class="why ${betul?'ok':'no'}">
      <b class="h">${betul?'✅ Betul':'❌ Belum tepat'}</b>
      ${betul?'':`<div style="margin-bottom:5px">Jawapan yang betul: <b>${esc(s.pilihan[s.jawapan])}</b></div>`}
      <div>${s.why}</div>
    </div>
    <button class="btn btn-primary" onclick="EL.seterusnya()">${akhir?'LIHAT MARKAH →':'SOALAN SETERUSNYA →'}</button>`;
  $('maklumbalas').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function seterusnya(){
  if(K.idx>=K.soalan.length-1) return tamat();
  K.idx++; soalan();
}

function keluar(){
  if(!confirm('Keluar dari kuiz? Markah tidak akan disimpan.')) return;
  const sid=K?K.subjek.id:SUBJECTS[0].id;
  K=null; subjek(sid);
}

function tamat(){
  const jum=K.soalan.length;
  const peratus=Math.round(K.betul/jum*100);
  const lama=state.markah[K.pid];

  state.markah[K.pid]={
    betul: lama ? Math.max(lama.betul, K.betul) : K.betul,   // simpan markah TERBAIK
    jumlah: jum,
    peratus: lama ? Math.max(lama.peratus, peratus) : peratus,
    cubaan: (lama?lama.cubaan:0)+1,
    terakhir: peratus,
  };
  save();
  keputusan({pid:K.pid, betul:K.betul, jumlah:jum, peratus, terbaik:state.markah[K.pid].peratus});
}

function keputusan(r){
  const f=cariPelajaran(r.pid);
  const g=gredBagi(r.peratus);
  const rekod=state.markah[r.pid];

  render(`${topbar(`<button class="iconbtn" onclick="EL.home()">🏠</button>`)}
    <div class="panel" style="text-align:center;padding:20px 16px">
      <div style="font-size:10.5px;letter-spacing:2.2px;font-weight:800;color:var(--text-muted)">MARKAH KAMU</div>
      <div style="font-size:15px;font-weight:700;margin:5px 0 13px">${esc(f.pelajaran.tajuk)}</div>
      <div class="gred g-${g.g}">${g.g}</div>
      <div style="font-size:13px;font-weight:800;color:var(--gold-light);margin-top:9px;font-family:var(--read)">${esc(g.kata)}</div>
      <div class="markah-besar" style="margin-top:12px">${r.betul}<span>/${r.jumlah}</span></div>
      <div style="font-size:20px;font-weight:900;color:var(--text-soft);font-family:var(--read);margin-top:2px">${r.peratus}%</div>
      <div style="display:flex;gap:7px;justify-content:center;margin-top:14px;flex-wrap:wrap">
        <div class="pill">🏆 Terbaik ${r.terbaik}%</div>
        <div class="pill">🔁 Cubaan ke-${rekod.cubaan}</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="EL.mula('${r.pid}')">CUBA LAGI 🔁</button>
    <button class="btn btn-secondary" style="margin-top:9px" onclick="EL.subjek('${f.subjek.id}')">PELAJARAN LAIN</button>
    <button class="btn btn-secondary" style="margin-top:9px" onclick="EL.laporan()">📊 LAPORAN MARKAH</button>
  `);
}

/* ============================================================
   5) LAPORAN MARKAH
   ============================================================ */
function laporan(){
  const blok=SUBJECTS.map(s=>{
    const baris=s.pelajaran.map(p=>{
      const m=state.markah[p.id];
      const g=m?gredBagi(m.peratus):null;
      return `<div class="lap-row">
        <div class="t"><b${m?'':' style="color:var(--text-muted)"'}>${esc(p.tajuk)}</b>
          <span>${m?`${m.betul}/${m.jumlah} betul · ${m.cubaan} kali cuba`:'Belum dijawab'}</span></div>
        <div class="m" ${m?'':'style="color:var(--text-muted)"'}>${m?`${m.peratus}% · ${g.g}`:'—'}</div>
      </div>`;
    }).join('');
    const r=ringkasanSubjek(s);
    return `<div class="section-label" style="color:${s.warna}">${esc(s.nama.toUpperCase())}${r?` · ${r.purata}%`:''}</div>
      <div class="panel" style="padding:5px 14px 9px">${baris}</div>`;
  }).join('');

  const sudah=Object.keys(state.markah).length;
  const purata = sudah ? Math.round(Object.values(state.markah).reduce((j,m)=>j+m.peratus,0)/sudah) : 0;
  const g=gredBagi(purata);

  render(`${topbar(`<button class="iconbtn" onclick="EL.home()">←</button>`)}
    <div class="panel" style="text-align:center;padding:18px 16px">
      <div style="font-size:10.5px;letter-spacing:2.2px;font-weight:800;color:var(--text-muted)">LAPORAN MARKAH</div>
      ${state.nama?`<div style="font-size:15px;font-weight:700;margin-top:5px">${esc(state.nama)}</div>`:''}
      ${sudah?`<div class="gred g-${g.g}" style="width:82px;height:82px;font-size:34px;margin-top:11px">${g.g}</div>
               <div class="markah-besar" style="margin-top:11px">${purata}<span>%</span></div>
               <div style="font-size:11px;color:var(--text-soft);margin-top:5px;font-family:var(--read)">Purata ${sudah} pelajaran yang telah dijawab</div>`
              :`<div class="kosong">Belum ada markah.<br>Pilih satu pelajaran dan mula menjawab soalan.</div>`}
    </div>
    ${blok}
  `);
}

/* ============================================================
   6) TETAPAN
   ============================================================ */
function tetapan(){
  render(`${topbar(`<button class="iconbtn" onclick="EL.home()">←</button>`)}
    <div class="panel">
      <div class="section-label" style="margin-top:0">⚙️ TETAPAN</div>
      <div style="font-size:11.5px;color:var(--text-soft);margin-bottom:7px;font-family:var(--read)">Nama murid (untuk laporan markah)</div>
      <input id="namaInput" value="${esc(state.nama)}" placeholder="Contoh: Ahmad Danish"
        style="width:100%;font-family:var(--read);font-size:14px;font-weight:700;padding:12px 14px;border-radius:var(--radius-sm);
               border:3px solid rgba(255,255,255,.26);background:rgba(0,0,0,.2);color:#fff;outline:none;user-select:text">
      <button class="btn btn-primary btn-sm" style="margin-top:9px" onclick="EL.simpanNama()">SIMPAN NAMA</button>
      <button class="btn btn-secondary" style="margin-top:14px" onclick="EL.togglBunyi()">${state.bunyi?'🔊 BUNYI: HIDUP':'🔇 BUNYI: MATI'}</button>
      <button class="btn btn-secondary" style="margin-top:9px" onclick="EL.reset()">🗑️ PADAM SEMUA MARKAH</button>
    </div>
    <div class="panel">
      <div class="section-label" style="margin-top:0">ℹ️ TENTANG</div>
      <div style="font-size:12px;line-height:1.75;color:var(--text-soft);font-family:var(--read);font-weight:600">
        e-Learning Sekolah Agama Darjah 1 — 6 subjek mengikut silabus
        Sekolah Agama Kerajaan Negeri Johor: Tauhid, Sirah, Akhlak, Bahasa Arab, Ibadat dan Jawi.
        <br><br>
        Murid menjawab soalan aneka pilihan dan memperoleh markah serta gred bagi setiap pelajaran.
        Markah terbaik disimpan dalam peranti ini sahaja.
        <br><br>
        <b style="color:var(--gold-light)">Nota:</b> nombor pelajaran (1.1, 2.3 dan seterusnya) belum diisi
        kerana senarai tajuk penuh perlu diambil daripada halaman isi kandungan kitab.
        Kandungan soalan perlu disemak oleh guru sebelum digunakan di dalam kelas.
      </div>
    </div>
  `);
}
function simpanNama(){
  const v=$('namaInput'); if(!v) return;
  state.nama=v.value.trim().slice(0,40); save(); toast('Nama disimpan');
}
function togglBunyi(){ state.bunyi=!state.bunyi; save(); tetapan(); }
function reset(){
  if(!confirm('Padam semua markah? Tindakan ini tidak boleh dibatalkan.')) return;
  const nama=state.nama; state=baseState(); state.nama=nama; save(); home(); toast('Semua markah telah dipadam');
}

/* ============================================================
   7) BOOT
   ============================================================ */
const EL={home, subjek, mula, jawab, seterusnya, keluar, laporan, tetapan, simpanNama, togglBunyi, reset};
window.EL=EL;
load();
home();
</script>
