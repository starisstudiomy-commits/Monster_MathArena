<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Monster MathArena — Kod Lesen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Nunito:wght@600;700;800;900&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Varela Round",system-ui,sans-serif;
  --display:"Orbitron",monospace;
  --gold:#D4AF37; --gold-light:#F5D55E; --gold-dark:#B8860B;
  --text:#F5F0E1; --text-secondary:#C4B896; --text-muted:#8B7D5E;
  --surface:#0A0A0A; --danger:#F44336;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);background:var(--surface);color:var(--text);
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,.1),transparent 60%),var(--surface);
}
.card{
  width:100%;max-width:360px;padding:32px 24px;border-radius:20px;text-align:center;
  background:linear-gradient(135deg,#1A1A1A,#0A0A0A);border:1px solid rgba(212,175,55,.25);
  box-shadow:0 16px 48px rgba(0,0,0,.7),0 0 40px rgba(212,175,55,.08);
}
.logo{font-size:44px;margin-bottom:8px}
h1{font-family:var(--display);font-size:16px;letter-spacing:2px;color:var(--gold);margin-bottom:4px}
p.sub{font-size:11px;color:var(--text-secondary);margin-bottom:22px;line-height:1.6}
input{
  width:100%;padding:14px 12px;border-radius:12px;border:2px solid rgba(212,175,55,.3);
  background:rgba(255,255,255,.05);color:var(--text);font-family:var(--display);font-size:13px;
  letter-spacing:2px;text-align:center;text-transform:uppercase;margin-bottom:12px;outline:none;
}
input:focus{border-color:var(--gold)}
input::placeholder{color:var(--text-muted);letter-spacing:1px}
button{
  width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer;
  font-family:var(--font);font-weight:700;font-size:13px;letter-spacing:1px;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#0A0A0A;
  box-shadow:0 4px 20px rgba(212,175,55,.35);transition:transform .15s ease,opacity .15s ease;
}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:default}
.msg{min-height:18px;margin-top:14px;font-size:11px;font-weight:600}
.msg.err{color:var(--danger)}
.msg.ok{color:#4CAF50}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🦁</div>
    <h1>MONSTER MATHARENA</h1>
    <p class="sub">Masukkan kod lesen untuk mula bermain</p>
    <input id="keyInput" type="text" placeholder="MMA-XXXXXXXX-XXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="submitBtn">SAHKAN &amp; MULA</button>
    <div class="msg" id="msg"></div>
  </div>
<script>
const input = document.getElementById('keyInput');
const btn = document.getElementById('submitBtn');
const msg = document.getElementById('msg');

// Kalau dah pernah sah sebelum ini, terus ke game (tak payah masuk kod berulang kali)
if (localStorage.getItem('mma_license_valid') === 'true') {
  location.href = 'index.html';
}

async function submitKey() {
  const key = input.value.trim().toUpperCase();
  if (!key) { showMsg('Sila masukkan kod lesen.', 'err'); return; }
  btn.disabled = true; showMsg('Mengesahkan...', '');
  try {
    const resp = await fetch('/api/validate-license', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key })
    });
    const data = await resp.json();
    if (data.ok) {
      localStorage.setItem('mma_license_valid', 'true');
      localStorage.setItem('mma_license_key', key);
      showMsg('Sah! Memuatkan game...', 'ok');
      setTimeout(() => { location.href = 'index.html'; }, 500);
    } else {
      showMsg(data.error || 'Kod lesen tidak sah.', 'err');
      btn.disabled = false;
    }
  } catch (e) {
    showMsg('Ralat rangkaian. Cuba lagi.', 'err');
    btn.disabled = false;
  }
}
function showMsg(text, cls) { msg.textContent = text; msg.className = 'msg ' + cls; }

btn.addEventListener('click', submitKey);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitKey(); });
</script>
</body>
</html>
