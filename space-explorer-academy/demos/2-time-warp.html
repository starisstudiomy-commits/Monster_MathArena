  :root {
    --bg:#01050a;
    --warp-r: 99; --warp-g: 140; --warp-b: 255;
    --flash-color: #eaf1ff;
    --accent-color: #4deaff;
    --accent-color2: #1c8fa8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; user-select:none; }
  #stage { position:relative; width:100%; height:100vh; max-width:520px; margin:0 auto; overflow:hidden; }
  canvas { position:absolute; inset:0; display:block; }

  /* ---------- HUD background dressing ---------- */
  .bg-grid {
    position:absolute; left:0; right:0; bottom:0; height:42%; z-index:1;
    background-image:
      repeating-linear-gradient(0deg, rgba(77,234,255,.14) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(77,234,255,.14) 0 1px, transparent 1px 34px);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.85), transparent 100%);
    mask-image: linear-gradient(to top, rgba(0,0,0,.85), transparent 100%);
    transform: perspective(320px) rotateX(62deg);
    transform-origin: bottom center;
    opacity:.4;
  }
  .bg-grid.top {
    top:0; bottom:auto; height:26%;
    transform: perspective(320px) rotateX(-62deg);
    transform-origin: top center;
    opacity:.2;
  }
  .scanlines {
    position:absolute; inset:0; pointer-events:none; z-index:6; opacity:.4;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);
  }
  .scan-sweep {
    position:absolute; left:0; right:0; height:110px; z-index:6; pointer-events:none;
    background:linear-gradient(to bottom, transparent, rgba(77,234,255,.07), transparent);
    animation: sweep 5s linear infinite;
  }
  @keyframes sweep { 0%{ transform:translateY(-140px);} 100%{ transform:translateY(100vh);} }
  .vignette { position:absolute; inset:0; z-index:5; pointer-events:none;
    box-shadow: inset 0 0 140px 40px #000c, inset 0 0 60px 10px #000a; }
  .particles { position:absolute; inset:0; z-index:2; pointer-events:none; }
  .particle {
    position:absolute; width:2px; height:2px; border-radius:50%; background:var(--accent-color);
    box-shadow:0 0 6px 1px var(--accent-color); opacity:.6; animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100%{ opacity:.15; transform:scale(1);} 50%{ opacity:.9; transform:scale(1.6);} }

  /* ---------- HUD chrome ---------- */
  .hud-readout-bar { position:absolute; top:0; left:0; right:0; z-index:8; padding:16px 18px 0; text-align:center; }
  .hud-readout {
    font-family:'Baloo 2',sans-serif; font-size:9.5px; letter-spacing:1.5px;
    color:var(--accent-color2); display:flex; justify-content:center; gap:14px;
  }
  .hud-readout span b { color:var(--accent-color); font-weight:700; }
  .hud-rule { margin:10px auto 0; height:1px; width:88%; background:linear-gradient(90deg,transparent,rgba(77,234,255,.6),transparent); }

  .theme-picker {
    position:absolute; top:52px; left:0; right:0; z-index:6;
    display:flex; justify-content:center; gap:8px;
  }
  .theme-btn {
    font-family:'Baloo 2',sans-serif;
    padding:7px 14px; font-size:10px; font-weight:700; letter-spacing:1.5px;
    border:1px solid rgba(77,234,255,.4); background:rgba(4,20,32,.55); color:var(--accent-color2); cursor:pointer;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .theme-btn.active { background:rgba(77,234,255,.18); color:var(--accent-color); border-color:var(--accent-color); box-shadow:0 0 12px rgba(77,234,255,.35); }
  .theme-btn:disabled { opacity:.3; cursor:not-allowed; }

  .title-overlay {
    position:absolute; top:110px; left:0; right:0; text-align:center; z-index:5;
    font-family:'Baloo 2',sans-serif; color:var(--accent-color); font-weight:900; font-size:15px; letter-spacing:5px;
    text-shadow:0 0 10px rgba(77,234,255,.85), 0 0 26px rgba(77,234,255,.4);
    opacity:.9; transition:opacity .3s ease;
  }

  .ui {
    position:absolute; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:18px 16px 26px; z-index:7;
    background:linear-gradient(180deg, transparent, #01050ae8 55%);
  }
  .caption {
    font-family:'Baloo 2',sans-serif; color:var(--accent-color); font-size:12px; letter-spacing:1.5px; font-weight:700;
    text-shadow:0 0 8px rgba(77,234,255,.5); min-height:18px; text-align:center;
  }
  .caption::before { content:'> '; opacity:.7; }
  .caption:empty::before { content:''; }
  .btn {
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:12px; letter-spacing:2px;
    padding:13px 30px; cursor:pointer;
    background:linear-gradient(135deg, rgba(77,234,255,.22), rgba(77,234,255,.06));
    border:1px solid var(--accent-color); color:var(--accent-color);
    box-shadow:0 0 18px rgba(77,234,255,.3), inset 0 0 12px rgba(77,234,255,.12);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  }
  .btn:disabled { opacity:.35; cursor:not-allowed; box-shadow:none; }
  .btn:not(:disabled):active { transform:scale(.96); }

  .flash {
    position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:4;
  }

  /* ---------- Arrival ---------- */
  .arrival {
    position:absolute; inset:0; z-index:9;
    display:flex; align-items:center; justify-content:center;
    background:var(--flash-color); opacity:0; pointer-events:none;
  }
  .arrival-text {
    font-family:'Baloo 2', sans-serif;
    font-weight:900; color:#0a0a0a; text-align:center;
    letter-spacing:1.5px; padding:0 24px;
    opacity:0; transform:scale(.9);
    transition:opacity .7s ease, transform .7s ease;
  }
  .arrival-text .line1 { font-size:11px; letter-spacing:5px; color:var(--accent-color2); margin-bottom:8px; }
  .arrival-text .line2 { font-size:22px; line-height:1.3; }

  /* ---------- Planet selection reveal ---------- */
  .planet-field {
    position:absolute; inset:0; z-index:3;
    opacity:0; pointer-events:none;
    overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
  }
  .planet-field.show { opacity:1; pointer-events:auto; transition:opacity .35s ease; }
  .planet-track { position:relative; height:100%; min-width:1180px; }
  .planet-track svg { position:absolute; inset:0; width:100%; height:100%; }

  .planet-node {
    position:absolute; width:64px; height:64px; margin-left:-32px; margin-top:-32px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer;
    opacity:0; transform:scale(.3) translateY(14px);
    transition:opacity .45s cubic-bezier(.2,1.3,.4,1), transform .45s cubic-bezier(.2,1.3,.4,1);
  }
  .planet-node.in { opacity:1; transform:scale(1) translateY(0); }
  .planet-orb {
    width:64px; height:64px; border-radius:50%; position:relative;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.5), transparent 42%),
               radial-gradient(circle at 50% 50%, var(--accent-color), var(--accent-color2) 75%, #041018 100%);
    border:1.5px solid rgba(77,234,255,.6);
    box-shadow:0 0 20px 3px rgba(77,234,255,.4), inset -6px -6px 14px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-weight:900; font-size:16px; color:#03141c;
  }
  .planet-node.locked .planet-orb { filter:grayscale(.7) brightness(.55); border-color:rgba(255,176,32,.5); }
  .p-ring {
    position:absolute; inset:-10px; border-radius:50%; border:1px dashed rgba(77,234,255,.55);
    animation: ringspin 10s linear infinite; opacity:0;
  }
  .planet-node.unlocked-glow .p-ring { opacity:1; }
  @keyframes ringspin { from{ transform:rotate(0);} to{ transform:rotate(360deg);} }
  .p-bracket { position:absolute; width:16px; height:16px; opacity:0; }
  .planet-node.unlocked-glow .p-bracket { opacity:.9; }
  .p-bracket::before, .p-bracket::after { content:''; position:absolute; background:var(--accent-color); box-shadow:0 0 5px var(--accent-color); }
  .p-bracket.tl { top:-24px; left:-24px; }
  .p-bracket.tr { top:-24px; right:-24px; transform:scaleX(-1); }
  .p-bracket.bl { bottom:-24px; left:-24px; transform:scaleY(-1); }
  .p-bracket.br { bottom:-24px; right:-24px; transform:scale(-1,-1); }
  .p-bracket::before { width:100%; height:2px; top:0; left:0; }
  .p-bracket::after { width:2px; height:100%; top:0; left:0; }
  .p-lock { position:absolute; top:-4px; right:-4px; font-size:12px; filter:drop-shadow(0 0 4px #ffb020); }

  .planet-node .pn-label {
    position:absolute; top:38px; left:50%; transform:translateX(-50%);
    font-family:'Baloo 2',sans-serif; font-size:8.5px; font-weight:700; letter-spacing:.5px; color:var(--accent-color); white-space:nowrap;
    text-shadow:0 0 8px rgba(77,234,255,.5); opacity:0; transition:opacity .3s ease;
  }
  .planet-node.in .pn-label { opacity:.9; }

  .planet-title {
    position:absolute; top:110px; left:0; right:0; text-align:center; z-index:5;
    color:var(--accent-color); font-family:'Baloo 2',sans-serif; font-weight:900; font-size:13px; letter-spacing:3px;
    text-shadow:0 0 10px rgba(77,234,255,.6); opacity:0; transition:opacity .4s ease;
  }
  .planet-title.show { opacity:.9; }

  /* ==================== BRIGHT KID-FRIENDLY THEME OVERRIDE ==================== */
  html, body { background: linear-gradient(180deg, #2a2f7a 0%, #3d4fc4 55%, #5b6ee8 100%); }
  .bg-grid { opacity:.18 !important; }
  .scanlines { opacity:.15 !important; }
  .scan-sweep { opacity:.5; }
  .vignette { box-shadow: inset 0 0 100px 30px rgba(20,15,60,.35) !important; }
  .particle { background:#fff700 !important; box-shadow:0 0 8px 2px #fff70099 !important; }

  .hud-readout { color:#dfe6ff !important; font-size:11px !important; }
  .hud-readout span b { color:#fff700 !important; }

  .theme-btn { border-radius:999px !important; clip-path:none !important; background:rgba(255,255,255,.18); color:#fff; border-color:rgba(255,255,255,.5); font-size:11px !important; }
  .theme-btn.active { background:#fff700; color:#3a2a6d; border-color:#fff700; box-shadow:0 3px 10px rgba(0,0,0,.25); }

  .title-overlay { color:#fff700 !important; text-shadow:0 2px 0 #7a4a00, 0 0 14px rgba(255,247,0,.5) !important; font-size:18px !important; }

  .caption { color:#fff !important; text-shadow:0 2px 4px rgba(0,0,0,.35) !important; font-size:14px !important; }
  .caption::before { content:'' !important; }
  .btn { border-radius:999px !important; clip-path:none !important; background:linear-gradient(135deg,#ffd23f,#ff9f1c) !important; border:none !important; color:#3a2a6d !important; box-shadow:0 5px 0 #c97400, 0 8px 16px rgba(0,0,0,.25) !important; font-size:14px !important; }
  .btn:disabled { background:#8a8fbf !important; color:#e5e7ff !important; box-shadow:none !important; }

  .arrival-text .line1 { color:#5b3fc9 !important; }
  .arrival-text .line2 { color:#232946 !important; }

  .planet-orb { border-color:rgba(255,255,255,.85) !important; box-shadow:0 0 24px 4px rgba(255,255,255,.5) !important; }
  .planet-node .pn-label { color:#fff !important; text-shadow:0 2px 4px rgba(0,0,0,.4) !important; font-size:10px !important; }
  .planet-title { color:#fff700 !important; text-shadow:0 2px 0 #7a4a00 !important; font-size:15px !important; }
  .p-lock { filter:drop-shadow(0 0 4px #3a2a6d) !important; }

</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div class="bg-grid"></div>
  <div class="bg-grid top"></div>
  <div class="particles" id="particles"></div>
  <div class="scan-sweep"></div>
  <div class="scanlines"></div>
  <div class="flash" id="flash"></div>

  <div class="arrival" id="arrival">
    <div class="arrival-text" id="arrivalText">
      <div class="line1">MISI BERJAYA</div>
      <div class="line2" id="arrivalLine2">ANDA TELAH TIBA DI<br>GALAXY MATEMATIK</div>
    </div>
  </div>

  <div class="planet-field" id="planetField">
    <div class="planet-track" id="planetTrack">
      <svg id="orbitSvg"><path id="orbitPath" fill="none" stroke="rgba(77,234,255,.3)" stroke-width="1.5" stroke-dasharray="4 7"/></svg>
    </div>
  </div>
  <div class="planet-title" id="planetTitle">PILIH PLANET</div>

  <div class="hud-readout-bar">
    <div class="hud-readout">
      <span>SYS <b>ONLINE</b></span>
      <span>NAV <b id="navState">STANDBY</b></span>
      <span>DEST <b id="destName">--</b></span>
    </div>
    <div class="hud-rule"></div>
  </div>

  <div class="theme-picker" id="themePicker">
    <button class="theme-btn active" data-g="math">MATH</button>
    <button class="theme-btn" data-g="science">SCIENCE</button>
    <button class="theme-btn" data-g="english">ENGLISH</button>
  </div>
  <div class="title-overlay" id="titleOverlay">GALAXY SELECTION</div>

  <div class="ui">
    <div class="caption" id="caption">Bersedia untuk berlepas...</div>
    <button class="btn" id="btn-warp">LANCAR TIME WARP</button>
  </div>

  <div class="vignette"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const flashEl = document.getElementById('flash');
const captionEl = document.getElementById('caption');
const btn = document.getElementById('btn-warp');
const arrivalEl = document.getElementById('arrival');
const arrivalTextEl = document.getElementById('arrivalText');
const arrivalLine2El = document.getElementById('arrivalLine2');
const themePicker = document.getElementById('themePicker');
const titleOverlay = document.getElementById('titleOverlay');
const planetField = document.getElementById('planetField');
const planetTrack = document.getElementById('planetTrack');
const planetTitle = document.getElementById('planetTitle');
const orbitPath = document.getElementById('orbitPath');
const navState = document.getElementById('navState');
const destName = document.getElementById('destName');
const particlesEl = document.getElementById('particles');
const root = document.documentElement;

const THEMES = {
  math:    { name: 'MATEMATIK', warp: '99,140,255',  flash: '#eaf1ff', accent: '#4deaff', accent2: '#1c8fa8',
              planets: ['Nombor','Tambah','Tolak','Wang','Masa','Bentuk','Panjang','Berat','Isipadu','Ulang Kaji'],
              icons: ['01','02','03','04','05','06','07','08','09','10'] },
  science: { name: 'SAINS', warp: '110,255,170', flash: '#eafff2', accent: '#4dffb0', accent2: '#159c68',
              planets: ['Hidupan','Habitat','Cuaca','Bahan','Tenaga','Deria','Bumi','Angkasa','Alat','Ulang Kaji'],
              icons: ['01','02','03','04','05','06','07','08','09','10'] },
  english: { name: 'ENGLISH', warp: '230,140,255', flash: '#faeaff', accent: '#d199ff', accent2: '#7e22ce',
              planets: ['Alphabet','Phonics','Nouns','Verbs','Adjectives','Sentences','Reading','Listening','Grammar','Review'],
              icons: ['01','02','03','04','05','06','07','08','09','10'] },
};
let currentGalaxy = 'math';

for (let i = 0; i < 22; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = (Math.random() * 100) + '%';
  p.style.top = (Math.random() * 100) + '%';
  p.style.animationDelay = (Math.random() * 3.5) + 's';
  particlesEl.appendChild(p);
}

function applyTheme(key) {
  currentGalaxy = key;
  const t = THEMES[key];
  root.style.setProperty('--warp-r', t.warp.split(',')[0]);
  root.style.setProperty('--warp-g', t.warp.split(',')[1]);
  root.style.setProperty('--warp-b', t.warp.split(',')[2]);
  root.style.setProperty('--flash-color', t.flash);
  root.style.setProperty('--accent-color', t.accent);
  root.style.setProperty('--accent-color2', t.accent2);
  arrivalLine2El.innerHTML = 'ANDA TELAH TIBA DI<br>GALAXY ' + t.name;
  destName.textContent = 'GALAXY-' + t.name.slice(0,3);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.g === key));
}
document.querySelectorAll('.theme-btn').forEach(b => {
  b.onclick = () => { if (phase === 'idle') applyTheme(b.dataset.g); };
});
applyTheme('math');

let W, H, CX, CY;
function resize() {
  W = canvas.width = stage().clientWidth;
  H = canvas.height = stage().clientHeight;
  CX = W / 2; CY = H / 2;
}
function stage() { return document.getElementById('stage'); }
resize();
addEventListener('resize', resize);

const STAR_COUNT = 420;
let stars = [];
function resetStars(idle) {
  stars = [];
  for (let i = 0; i < STAR_COUNT; i++) stars.push(makeStar(idle));
}
function makeStar(idle) {
  const angle = Math.random() * Math.PI * 2;
  const dist = idle ? Math.random() * Math.max(W, H) * 0.6 : Math.random() * 4;
  return { angle, dist, z: 0.2 + Math.random() * 0.8, prevX: null, prevY: null };
}

let phase = 'idle';
let phaseStart = performance.now();
const DURATIONS = { accel: 900, cruise: 1600, decel: 1300 };

function speedForPhase(t) {
  if (phase === 'accel') return 0.06 + easeInCubic(clamp01(t / DURATIONS.accel)) * 0.94;
  if (phase === 'cruise') return 1;
  if (phase === 'decel') return 1 - easeInCubic(clamp01(t / DURATIONS.decel)) * 0.94;
  return 0.06;
}
function clamp01(x) { return Math.max(0, Math.min(1, x)); }
function easeInCubic(x) { return x * x * x; }
function setPhase(p) { phase = p; phaseStart = performance.now(); }

resetStars(true);

function captionsFor(key) {
  const name = THEMES[key].name;
  return {
    accel: 'Time Warp diaktifkan...',
    cruise: 'Melangkau angkasa lepas...',
    decel: 'Menghampiri Galaxy ' + name + '...',
  };
}

btn.onclick = () => {
  if (phase === 'idle') { startWarp(); return; }
  if (phase === 'planets-done') { resetDemo(); return; }
};

function startWarp() {
  btn.disabled = true;
  themePicker.querySelectorAll('.theme-btn').forEach(b => b.disabled = true);
  titleOverlay.style.opacity = '0';
  navState.textContent = 'WARP';
  flashPulse();
  setPhase('accel');
  const captions = captionsFor(currentGalaxy);
  captionEl.textContent = captions.accel;

  const tAccel = DURATIONS.accel;
  const tCruise = tAccel + DURATIONS.cruise;
  const tDecel = tCruise + DURATIONS.decel;

  setTimeout(() => { setPhase('cruise'); captionEl.textContent = captions.cruise; }, tAccel);
  setTimeout(() => { setPhase('decel'); captionEl.textContent = captions.decel; navState.textContent = 'APPROACH'; }, tCruise);
  setTimeout(() => { arrivalSequence(); }, tDecel - 150);
}

function arrivalSequence() {
  captionEl.textContent = '';
  navState.textContent = 'ARRIVED';
  arrivalEl.style.transition = 'opacity 1s ease-out';
  arrivalEl.style.opacity = '1';

  setTimeout(() => {
    arrivalTextEl.style.opacity = '1';
    arrivalTextEl.style.transform = 'scale(1)';
  }, 900);

  setTimeout(() => {
    arrivalTextEl.style.opacity = '0';
    arrivalTextEl.style.transform = 'scale(1.04)';
  }, 2600);
  setTimeout(() => {
    arrivalEl.style.transition = 'opacity 1s ease-in';
    arrivalEl.style.opacity = '0';
  }, 2850);

  setTimeout(() => { showPlanets(); }, 3900);
}

function flashPulse() {
  flashEl.style.transition = 'none';
  flashEl.style.opacity = '.5';
  requestAnimationFrame(() => {
    flashEl.style.transition = 'opacity .5s ease';
    flashEl.style.opacity = '0';
  });
}

function buildPlanetLayout() {
  const t = THEMES[currentGalaxy];
  const n = t.planets.length;
  const spacingX = 108;
  const amp = Math.min(70, (H - 260) / 2);
  const baseY = H / 2 + 10;
  const positions = [];
  for (let i = 0; i < n; i++) {
    const x = 70 + i * spacingX;
    const y = baseY + Math.sin(i * 0.85) * amp;
    positions.push({ x, y });
  }
  planetTrack.style.minWidth = (positions[n - 1].x + 90) + 'px';

  let d = `M ${positions[0].x} ${positions[0].y}`;
  for (let i = 1; i < n; i++) d += ` L ${positions[i].x} ${positions[i].y}`;
  orbitPath.setAttribute('d', d);

  planetTrack.querySelectorAll('.planet-node').forEach(el => el.remove());
  positions.forEach((p, i) => {
    const locked = i > 0;
    const node = document.createElement('div');
    node.className = 'planet-node' + (locked ? ' locked' : ' unlocked-glow');
    node.style.left = p.x + 'px';
    node.style.top = p.y + 'px';
    node.style.transitionDelay = (i * 55) + 'ms';
    node.innerHTML = `
      <div class="p-ring"></div>
      <div class="p-bracket tl"></div>
      <div class="p-bracket tr"></div>
      <div class="p-bracket bl"></div>
      <div class="p-bracket br"></div>
      <div class="planet-orb">${t.icons[i]}${locked ? '<span class="p-lock">&#128274;</span>' : ''}</div>
      <span class="pn-label">${i + 1}. ${t.planets[i]}</span>`;
    planetTrack.appendChild(node);
  });
}

function showPlanets() {
  setPhase('planets');
  buildPlanetLayout();
  planetField.classList.add('show');
  planetTitle.classList.add('show');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      planetTrack.querySelectorAll('.planet-node').forEach(el => el.classList.add('in'));
    });
  });
  captionEl.textContent = 'Planet manakah yang ingin diterokai?';
  setTimeout(() => {
    phase = 'planets-done';
    btn.textContent = 'MAIN SEMULA';
    btn.disabled = false;
  }, n_delay());
}
function n_delay() {
  const n = THEMES[currentGalaxy].planets.length;
  return n * 55 + 500;
}

function resetDemo() {
  planetField.classList.remove('show');
  planetTrack.querySelectorAll('.planet-node').forEach(el => el.classList.remove('in'));
  planetTitle.classList.remove('show');
  titleOverlay.style.opacity = '.9';
  themePicker.querySelectorAll('.theme-btn').forEach(b => b.disabled = false);
  btn.textContent = 'LANCAR TIME WARP';
  captionEl.textContent = 'Bersedia untuk berlepas...';
  navState.textContent = 'STANDBY';
  resetStars(true);
  setPhase('idle');
}

let last = performance.now();
function tick(now) {
  const dt = Math.min(48, now - last);
  last = now;
  const t = now - phaseStart;
  const speedMul = speedForPhase(t);
  const cs = getComputedStyle(root);
  const wr = cs.getPropertyValue('--warp-r').trim();
  const wg = cs.getPropertyValue('--warp-g').trim();
  const wb = cs.getPropertyValue('--warp-b').trim();

  ctx.fillStyle = phase === 'cruise' ? 'rgba(35,40,115,0.35)' : 'rgba(35,40,115,0.5)';
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const speed = (0.9 + s.z * 3.2) * speedMul * (dt / 16.7);
    s.dist += speed * 6;
    const x = CX + Math.cos(s.angle) * s.dist;
    const y = CY + Math.sin(s.angle) * s.dist;

    if (x < -50 || x > W + 50 || y < -50 || y > H + 50) {
      const ns = makeStar(false);
      ns.dist = 0;
      Object.assign(s, ns);
      s.prevX = null; s.prevY = null;
      continue;
    }

    const size = 0.6 + s.z * (phase === 'idle' || phase === 'planets' || phase === 'planets-done' ? 1.2 : 2.2);
    const alpha = 0.5 + s.z * 0.5;

    if (s.prevX !== null && speedMul > 0.15) {
      ctx.strokeStyle = `rgba(${wr},${wg},${wb},${alpha})`;
      ctx.lineWidth = size;
      ctx.beginPath();
      ctx.moveTo(s.prevX, s.prevY);
      ctx.lineTo(x, y);
      ctx.stroke();
    } else {
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(x, y, size * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
    s.prevX = x; s.prevY = y;
  }

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
