  :root {
    --font:'Nunito',system-ui,sans-serif;
    --display:'Orbitron',monospace;
    --readable:'Nunito',system-ui,sans-serif;
    --gold:#D4AF37; --gold-light:#F5D55E; --gold-dark:#B8860B;
    --glass-border:rgba(212,175,55,.25); --glass-highlight:rgba(212,175,55,.4);
    --text-secondary:#C4B896; --text-muted:#8B7D5E;
    --success:#4CAF50; --warning:#FFC107; --danger:#F44336; --pink:#EC4899;
    --bg0:#0a0a0f;
    --shadow-sm:0 2px 8px rgba(0,0,0,.5); --shadow-md:0 8px 24px rgba(0,0,0,.6);
    --shadow-lg:0 16px 48px rgba(0,0,0,.7); --shadow-glow:0 0 40px rgba(212,175,55,.2);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:var(--font); background:var(--bg0); color:#fff; }
  #stage { position:relative; max-width:480px; margin:0 auto; height:100vh; overflow:hidden; padding:12px; display:flex; flex-direction:column; }

  .topbar { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .pill { background:rgba(212,175,55,.1); border:1px solid var(--glass-border); border-radius:999px;
    padding:4px 10px; font-size:11px; color:var(--gold); font-family:var(--display); }

  .arena { position:relative; border-radius:20px; padding:14px; overflow:hidden;
    background:linear-gradient(180deg, rgba(10,10,10,.9), rgba(20,20,20,.95));
    border:2px solid var(--glass-border); box-shadow:var(--shadow-lg), var(--shadow-glow);
  }
  .arena::before { content:""; position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 0%, rgba(212,175,55,.15), transparent 60%); pointer-events:none; }

  .fighter { display:flex; align-items:center; gap:10px; position:relative; z-index:2; }
  .fighter.enemy { flex-direction:row-reverse; text-align:right; }
  .fighter-art { position:relative; width:88px; height:88px; flex:0 0 auto; }
  .fighter-art img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .hpwrap { flex:1; min-width:0; }
  .hpname { font-weight:700; font-size:10px; display:flex; justify-content:space-between; gap:4px;
    color:var(--text-secondary); letter-spacing:.5px; font-family:var(--display); }
  .hpbar { height:8px; background:rgba(255,255,255,.1); border-radius:4px; overflow:hidden; margin-top:4px;
    border:1px solid rgba(255,255,255,.1); }
  .hpfill { height:100%; background:linear-gradient(90deg, var(--success), #34D399);
    transition:width .4s cubic-bezier(.4,0,.2,1); border-radius:4px; box-shadow:0 0 8px rgba(16,185,129,.5); }
  .hpfill.low { background:linear-gradient(90deg, var(--danger), #F87171); box-shadow:0 0 8px rgba(239,68,68,.5); }
  .enemy-hpfill { background:linear-gradient(90deg, var(--pink), #F472B6); box-shadow:0 0 8px rgba(236,72,153,.5); }

  .vs { text-align:center; font-family:var(--display); color:var(--text-muted); font-size:14px;
    letter-spacing:2px; margin:6px 0; text-transform:uppercase; }

  .combowrap { margin:10px 0 0; position:relative; z-index:2; }
  .combometer { height:6px; background:rgba(255,255,255,.1); border-radius:3px; overflow:hidden; border:1px solid rgba(255,255,255,.1); }
  .combofill { height:100%; width:0; background:linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light));
    transition:width .3s; border-radius:3px; box-shadow:0 0 12px rgba(212,175,55,.6); }
  .combotxt { text-align:center; font-weight:700; font-size:10px; margin-top:3px; height:14px; color:var(--gold); font-family:var(--display); }

  .timerwrap { margin:8px 0 0; position:relative; z-index:2; }
  .timerbar { height:6px; background:rgba(255,255,255,.1); border-radius:3px; overflow:hidden; border:1px solid rgba(255,255,255,.1); }
  .timerfill { height:100%; width:100%; background:linear-gradient(90deg, var(--success), #34D399); transition:width .1s linear; border-radius:3px; }
  .timerfill.warning { background:linear-gradient(90deg, var(--warning), #FBBF24); }
  .timerfill.danger { background:linear-gradient(90deg, var(--danger), #F87171); animation:timer-pulse .5s infinite; }
  @keyframes timer-pulse { 0%,100%{opacity:1;} 50%{opacity:.6;} }
  .timertxt { text-align:center; font-weight:700; font-size:9px; margin-top:2px; color:var(--text-secondary); font-family:var(--display); }
  .timertxt.warning { color:var(--warning); }
  .timertxt.danger { color:var(--danger); }

  .qbox { position:relative; border-radius:14px; padding:16px 12px; text-align:center; margin:10px 0 0;
    background:rgba(212,175,55,.08); border:2px solid var(--glass-border); box-shadow:var(--shadow-md), inset 0 1px 0 var(--glass-highlight); }
  .qtext { font-family:var(--readable); font-weight:800; font-size:clamp(22px,5.5vw,28px); color:#fff;
    text-shadow:0 2px 12px rgba(0,0,0,.5); line-height:1.2; }

  .choices { display:flex; justify-content:center; gap:6px; max-width:420px; margin:10px auto 0; flex-wrap:wrap; }
  .choice { font-family:var(--readable); font-weight:800; font-size:18px; padding:12px 6px; min-width:0;
    flex:1 1 40%; max-width:180px; color:#fff; cursor:pointer; border:none; border-radius:12px; position:relative;
    overflow:hidden; background:rgba(212,175,55,.12); border:2px solid var(--glass-border);
    box-shadow:var(--shadow-sm), inset 0 1px 0 var(--glass-highlight); transition:all .15s; }
  .choice:active { transform:translateY(2px); box-shadow:none; }
  .choice.correct { background:linear-gradient(135deg, #2E7D32, #1B5E20)!important; border-color:var(--success)!important;
    box-shadow:0 0 20px rgba(76,175,80,.6)!important; color:#fff!important; }
  .choice.wrong { background:linear-gradient(135deg, #C62828, #B71C1C)!important; border-color:var(--danger)!important;
    box-shadow:0 0 20px rgba(244,67,54,.6)!important; color:#fff!important; }
  .choice:disabled { cursor:default; }

  .feedback { text-align:center; font-weight:700; min-height:16px; margin-top:6px; font-size:11px; color:var(--text-secondary); }

  .dmg { position:absolute; z-index:6; font-family:var(--display); font-weight:800; font-style:italic;
    pointer-events:none; animation:dmgpop 1s ease-out forwards; top:10px; }
  .dmg.norm { font-size:24px; color:#fff; }
  .dmg.crit { font-size:30px; color:var(--warning); }
  .dmg.enemy { font-size:20px; color:var(--danger); }
  @keyframes dmgpop {
    0%{ opacity:0; transform:translateY(8px) scale(.5); }
    20%{ opacity:1; transform:translateY(-4px) scale(1.2); }
    100%{ opacity:0; transform:translateY(-60px) scale(.8); }
  }

  .shake { animation:shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px) rotate(-1deg);} 75%{transform:translateX(6px) rotate(1deg);} }
  .shake-hard { animation:shake-hard .5s ease-out; }
  @keyframes shake-hard {
    0%,100%{transform:translate(0,0) rotate(0);}
    10%{transform:translate(-16px,3px) rotate(-3deg);} 20%{transform:translate(14px,-3px) rotate(3deg);}
    35%{transform:translate(-12px,2px) rotate(-2deg);} 50%{transform:translate(10px,-2px) rotate(2deg);}
    65%{transform:translate(-7px,1px) rotate(-1deg);} 80%{transform:translate(5px,-1px) rotate(1deg);}
    92%{transform:translate(-2px,0) rotate(0);}
  }
  .recoil { animation:hit-recoil .35s ease; }
  @keyframes hit-recoil {
    0%{transform:translateX(0) rotate(0);} 20%{transform:translateX(-8px) rotate(-2deg);}
    40%{transform:translateX(6px) rotate(1deg);} 60%{transform:translateX(-3px) rotate(-.5deg);} 100%{transform:translateX(0) rotate(0);}
  }
  .impact { animation:hit-recoil-big .55s ease, flash-hit-big .55s ease; }
  @keyframes hit-recoil-big {
    0%{transform:translateX(0) rotate(0) scale(1);} 10%{transform:translateX(-46px) rotate(-16deg) scale(.72);}
    26%{transform:translateX(36px) rotate(11deg) scale(1.18);} 42%{transform:translateX(-24px) rotate(-7deg) scale(1.06);}
    58%{transform:translateX(14px) rotate(4deg) scale(1.02);} 75%{transform:translateX(-6px) rotate(-1.5deg) scale(1);}
    100%{transform:translateX(0) rotate(0) scale(1);}
  }
  @keyframes flash-hit-big {
    0%{filter:brightness(1);} 10%{filter:brightness(4) saturate(2) contrast(1.4);}
    30%{filter:brightness(1.7);} 100%{filter:brightness(1);}
  }
  .lunge { animation:lunge-attack .45s cubic-bezier(.34,1.56,.64,1); position:relative; z-index:9; }
  @keyframes lunge-attack {
    0%{transform:translate(0,0) rotate(0) scale(1);} 22%{transform:translate(6px,10px) rotate(4deg) scale(.94);}
    45%{transform:translate(30px,-90px) rotate(-14deg) scale(1.22);} 62%{transform:translate(24px,-72px) rotate(-8deg) scale(1.12);}
    100%{transform:translate(0,0) rotate(0) scale(1);}
  }
  .lunge-enemy { animation:lunge-attack-enemy .45s cubic-bezier(.34,1.56,.64,1); position:relative; z-index:9; }
  @keyframes lunge-attack-enemy {
    0%{transform:translate(0,0) rotate(0) scale(1);} 22%{transform:translate(-6px,-10px) rotate(-4deg) scale(.94);}
    45%{transform:translate(-30px,90px) rotate(14deg) scale(1.22);} 62%{transform:translate(-24px,72px) rotate(8deg) scale(1.12);}
    100%{transform:translate(0,0) rotate(0) scale(1);}
  }

  .projectile { position:absolute; z-index:5; pointer-events:none; width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle,#F5D55E,#D4AF37); box-shadow:0 0 12px rgba(212,175,55,.8),0 0 30px rgba(212,175,55,.3);
    top:50%; opacity:0; }
  .projectile.ult { width:26px; height:26px; box-shadow:0 0 20px rgba(239,68,68,.9),0 0 44px rgba(239,68,68,.4); }
  .projectile.p2e.fire { left:15%; animation:projRight .3s ease-in forwards; }
  @keyframes projRight { 0%{opacity:1; left:15%;} 78%{opacity:1; left:82%;} 100%{opacity:0; left:82%;} }
  .projectile.e2p.fire { right:15%; animation:projLeft .3s ease-in forwards; }
  @keyframes projLeft { 0%{opacity:1; right:15%;} 78%{opacity:1; right:82%;} 100%{opacity:0; right:82%;} }

  .whiteflash { position:fixed; inset:0; background:#fff; pointer-events:none; opacity:0; z-index:50; }
  .whiteflash.go { animation:white-flash-anim .18s ease-out forwards; }
  @keyframes white-flash-anim { 0%{opacity:.5;} 100%{opacity:0;} }

  .end-screen .btn { border:none; border-radius:12px; padding:12px 30px; font-family:var(--display);
    font-weight:700; font-size:12px; letter-spacing:1px; cursor:pointer;
    background:linear-gradient(135deg, var(--gold-light), var(--gold)); color:#1a1200; box-shadow:var(--shadow-sm); }

        <div class="hpbar"><div class="hpfill" id="playerHpFill" style="width:100%"></div></div>
      </div>
    </div>

    <div class="projectile p2e" id="projP2E"></div>
    <div class="projectile e2p" id="projE2P"></div>

    <div class="combowrap">
      <div class="combometer"><div class="combofill" id="comboFill"></div></div>
      <div class="combotxt" id="comboTxt"></div>
    </div>

    <div class="timerwrap">
      <div class="timerbar"><div class="timerfill" id="timerFill"></div></div>
      <div class="timertxt" id="timerTxt">&#9203; 10s</div>
    </div>
  </div>

  <div class="qbox">
    <div class="qtext" id="qtext">3 + 4 = ?</div>
  </div>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>

  <div class="end-screen" id="winScreen">
    <div class="big">&#127942;</div>
    <h2>MUSUH DIKALAHKAN</h2>
    <div class="rewards">&#10024; +50 EXP &nbsp; &#129704; +20 Mineral</div>
    <button class="btn" id="btnWinRestart">MAIN SEMULA</button>
  </div>
  <div class="end-screen" id="loseScreen">
    <div class="big">&#128165;</div>
    <h2>SPACEBOT PERLU BERUNDUR</h2>
    <div class="rewards">Jangan risau, cuba lagi!</div>
    <button class="btn" id="btnLoseRestart">CUBA LAGI</button>
  </div>
  <div class="whiteflash" id="whiteflash"></div>
</div>

<script>
const PLAYER_MAX = 100, ENEMY_MAX = 100;
const COMBO_ATTACK_REQ = 3, COMBO_ULTIMATE_REQ = 6;
let playerHP = PLAYER_MAX, enemyHP = ENEMY_MAX, streak = 0;
let timerInterval = null, timerLeft = 10, timerMax = 10;

const $ = id => document.getElementById(id);
const enemyArt = $('enemyArt'), playerArt = $('playerArt');
const enemyHpFill = $('enemyHpFill'), playerHpFill = $('playerHpFill');
const enemyHpTxt = $('enemyHpTxt'), playerHpTxt = $('playerHpTxt');
const comboFill = $('comboFill'), comboTxt = $('comboTxt');
const timerFill = $('timerFill'), timerTxt = $('timerTxt');
const qtext = $('qtext'), choicesEl = $('choices'), feedback = $('feedback');
const projP2E = $('projP2E'), projE2P = $('projE2P');
const whiteflash = $('whiteflash');
const arena = $('arena');
const winScreen = $('winScreen'), loseScreen = $('loseScreen');

function updateHP() {
  const pPct = Math.max(0, playerHP / PLAYER_MAX * 100);
  const ePct = Math.max(0, enemyHP / ENEMY_MAX * 100);
  playerHpFill.style.width = pPct + '%';
  enemyHpFill.style.width = ePct + '%';
  playerHpFill.classList.toggle('low', pPct < 30);
  playerHpTxt.textContent = Math.max(0, playerHP) + '/' + PLAYER_MAX;
  enemyHpTxt.textContent = Math.max(0, enemyHP) + '/' + ENEMY_MAX;
}

function updateCombo() {
  const pct = Math.min(100, streak / COMBO_ULTIMATE_REQ * 100);
  comboFill.style.width = pct + '%';
  const colors = pct >= 100 ? '#F44336,#FF9800,#FFEB3B' : pct >= 50 ? '#FF9800,#FFC107,#FFEB3B' : pct > 0 ? '#2196F3,#03A9F4,#00BCD4' : '#888,#999,#aaa';
  comboFill.style.background = 'linear-gradient(90deg,' + colors + ')';
  comboTxt.textContent = streak >= COMBO_ULTIMATE_REQ ? '\u{1F525} ULTIMATE (x3)' : streak >= COMBO_ATTACK_REQ ? '\u{2B50} ATTACK (x2)' : streak > 0 ? ('Combo ' + streak) : '';
}

function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

function startTimer() {
  stopTimer();
  timerMax = 10; timerLeft = 10;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerLeft--;
    updateTimerDisplay();
    if (timerLeft <= 0) {
      stopTimer();
      document.querySelectorAll('.choice').forEach(b => b.disabled = true);
      feedback.textContent = 'Masa tamat!';
      resolveWrong();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const pct = (timerLeft / timerMax) * 100;
  timerFill.style.width = pct + '%';
  timerTxt.textContent = '⏳ ' + timerLeft + 's';
  timerFill.classList.remove('warning', 'danger');
  timerTxt.classList.remove('warning', 'danger');
  if (pct <= 30) { timerFill.classList.add('danger'); timerTxt.classList.add('danger'); }
  else if (pct <= 50) { timerFill.classList.add('warning'); timerTxt.classList.add('warning'); }
}

function genQuestion() {
  const a = 2 + Math.floor(Math.random() * 10);
  const b = 1 + Math.floor(Math.random() * 9);
  const isAdd = Math.random() < 0.5;
  const answer = isAdd ? a + b : Math.max(a, b) - Math.min(a, b);
  const prompt = isAdd ? (a + ' + ' + b + ' = ?') : (Math.max(a,b) + ' - ' + Math.min(a,b) + ' = ?');
  const opts = new Set([answer]);
  while (opts.size < 4) {
    const delta = 1 + Math.floor(Math.random() * 5);
    const cand = answer + (Math.random() < 0.5 ? delta : -delta);
    if (cand >= 0) opts.add(cand);
  }
  return { prompt, answer, choices: [...opts].sort(() => Math.random() - 0.5) };
}

let curQ = null;
function nextQuestion() {
  curQ = genQuestion();
  qtext.textContent = curQ.prompt;
  choicesEl.innerHTML = '';
  curQ.choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => onAnswer(btn, c === curQ.answer);
    choicesEl.appendChild(btn);
  });
  feedback.textContent = '';
  startTimer();
}

function spawnDmg(container, text, cls) {
  const d = document.createElement('div');
  d.className = 'dmg ' + cls;
  d.textContent = text;
  d.style.left = '50%';
  d.style.transform = 'translateX(-50%)';
  container.appendChild(d);
  setTimeout(() => d.remove(), 1000);
}

function flashWhite() {
  whiteflash.classList.remove('go'); void whiteflash.offsetWidth; whiteflash.classList.add('go');
}

function onAnswer(btn, correct) {
  stopTimer();
  document.querySelectorAll('.choice').forEach(b => b.disabled = true);
  btn.classList.add(correct ? 'correct' : 'wrong');
  if (correct) { resolveCorrect(); } else { resolveWrong(); }
}

function resolveCorrect() {
  streak++;
  updateCombo();
  const ultimate = streak >= COMBO_ULTIMATE_REQ;
  const attack = streak >= COMBO_ATTACK_REQ;
  const mult = ultimate ? 3 : attack ? 2 : 1;

  playerArt.classList.remove('lunge'); void playerArt.offsetWidth; playerArt.classList.add('lunge');

  setTimeout(() => {
    projP2E.className = 'projectile p2e' + (ultimate ? ' ult' : '');
    void projP2E.offsetWidth;
    projP2E.classList.add('fire');
  }, 90);

  setTimeout(() => {
    const baseDmg = 8 + Math.floor(Math.random() * 5);
    const dmg = baseDmg * mult;
    enemyHP -= dmg;
    enemyArt.classList.remove('impact', 'shake'); void enemyArt.offsetWidth;
    enemyArt.classList.add(mult >= 2 ? 'impact' : 'shake');
    arena.classList.remove('shake', 'shake-hard'); void arena.offsetWidth;
    arena.classList.add(ultimate ? 'shake-hard' : 'shake');
    if (ultimate) flashWhite();
    spawnDmg(enemyArt, '-' + dmg, ultimate ? 'crit' : 'norm');
    feedback.textContent = ultimate ? '\u{1F525} ULTIMATE HIT!' : attack ? '⭐ Serangan Kuat!' : 'Kena!';
    updateHP();
    if (enemyHP <= 0) { setTimeout(() => finishBattle(true), 700); return; }
    setTimeout(nextQuestion, 1100);
  }, 390);
}

function resolveWrong() {
  streak = 0;
  updateCombo();
  enemyArt.classList.remove('lunge-enemy'); void enemyArt.offsetWidth; enemyArt.classList.add('lunge-enemy');

  setTimeout(() => {
    projE2P.className = 'projectile e2p';
    void projE2P.offsetWidth;
    projE2P.classList.add('fire');
  }, 90);

  setTimeout(() => {
    const dmg = 8 + Math.floor(Math.random() * 7);
    playerHP -= dmg;
    playerArt.classList.remove('impact', 'shake'); void playerArt.offsetWidth; playerArt.classList.add('impact');
    arena.classList.remove('shake', 'shake-hard'); void arena.offsetWidth; arena.classList.add('shake-hard');
    spawnDmg(playerArt, '-' + dmg, 'enemy');
    feedback.textContent = 'Alien menyerang balik!';
    updateHP();
    if (playerHP <= 0) { setTimeout(() => finishBattle(false), 700); return; }
    setTimeout(nextQuestion, 1100);
  }, 390);
}

function finishBattle(won) {
  if (won) winScreen.classList.add('show'); else loseScreen.classList.add('show');
}

function restart() {
  playerHP = PLAYER_MAX; enemyHP = ENEMY_MAX; streak = 0;
  winScreen.classList.remove('show'); loseScreen.classList.remove('show');
  updateHP(); updateCombo(); nextQuestion();
}

$('btnWinRestart').onclick = restart;
$('btnLoseRestart').onclick = restart;

updateHP(); updateCombo(); nextQuestion();
</script>
