  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:'Baloo 2',sans-serif;
    background:linear-gradient(180deg,#2a2f7a 0%,#3d4fc4 55%,#5b6ee8 100%); }
  #stage { position:relative; max-width:480px; margin:0 auto; height:100vh; overflow:hidden; }
  .top { position:absolute; top:0; left:0; right:0; z-index:5; text-align:center; padding:16px; }
  .top h1 { color:#fff700; font-size:18px; text-shadow:0 2px 0 #7a4a00; margin:0 0 4px; }
  .top p { color:#dfe6ff; font-size:12px; margin:0; }

  .ground { position:absolute; inset:0; }
  .ground svg { position:absolute; inset:0; width:100%; height:100%; }

  .node { position:absolute; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%;
    background:rgba(255,255,255,.95); border:4px solid #fff; box-shadow:0 6px 14px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:#5b3fc9;
    cursor:pointer; transition:transform .15s ease, opacity .3s ease; animation:bob 2.6s ease-in-out infinite; z-index:2; }
  .node:active { transform:scale(.9); }
  .node.revealed { cursor:default; animation:none; }
  .node.mineral { background:linear-gradient(135deg,#ffe27a,#ff9f1c); border-color:#ffb020; }
  .node.alien { background:linear-gradient(135deg,#ff8ba7,#c0392b); border-color:#ff5c7a; }
  .node.locked-temp { pointer-events:none; opacity:.4; animation:none; }
  @keyframes bob { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  .node-label { position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:6px;
    font-size:11px; font-weight:800; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.4); white-space:nowrap; opacity:0; transition:opacity .3s; }
  .node.revealed .node-label { opacity:1; }

  .toast { position:absolute; left:0; right:0; bottom:0; z-index:6; text-align:center;
    padding:18px 20px 26px; background:linear-gradient(to top,#2a2f7ae8 45%,transparent);
    opacity:0; pointer-events:none; transition:opacity .3s ease; }
  .toast.show { opacity:1; pointer-events:auto; }
  .toast .card { display:inline-block; background:rgba(255,255,255,.96); color:#232946; border-radius:16px;
    padding:16px 22px; font-size:15px; font-weight:600; box-shadow:0 6px 16px rgba(0,0,0,.25); }
  .toast .card b { display:block; font-size:18px; margin-bottom:4px; }
  .toast .btn { display:block; margin:12px auto 0; border:none; border-radius:999px; padding:10px 26px;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13px; letter-spacing:1px; cursor:pointer;
    background:linear-gradient(135deg,#ffd23f,#ff9f1c); color:#3a2a6d; box-shadow:0 4px 0 #c97400; }

  .progress { position:absolute; top:64px; left:0; right:0; z-index:5; text-align:center; }
  .progress span { background:rgba(255,255,255,.2); color:#fff; font-size:11px; font-weight:700;
    padding:5px 14px; border-radius:999px; }

  .map-frame { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
    width:92%; aspect-ratio:695/700; filter:drop-shadow(0 10px 20px rgba(0,0,0,.35)); }
  .map-frame img { position:absolute; inset:0; width:100%; height:100%; }
  .map-frame svg { position:absolute; inset:0; width:100%; height:100%; }
  #nodes { position:absolute; inset:0; }

</style>

  <div id="nodes-wrap" class="map-frame" style="filter:none">
    <div id="nodes" style="position:absolute;inset:0"></div>
  </div>
  <div class="top"><h1>PETA PLANET NOMBOR</h1><p>Klik satu lokasi untuk terokai &mdash; mineral atau alien?</p></div>
  <div class="progress"><span id="progressText">0 / 8 diterokai</span></div>
  
  <div class="toast" id="toast"><div class="card"><div id="toastCard"></div><button class="btn" id="toastBtn">TERUSKAN</button></div></div>
</div>

<script>
const LOCATIONS = [
  {x:28,y:20,type:'mineral',label:'Mineral Deposit'},
  {x:68,y:17,type:'alien',label:'Alien Patrol'},
  {x:18,y:42,type:'mineral',label:'Mineral Deposit'},
  {x:48,y:38,type:'mineral',label:'Mineral Deposit'},
  {x:78,y:42,type:'alien',label:'Alien Patrol'},
  {x:22,y:68,type:'mineral',label:'Mineral Deposit'},
  {x:48,y:72,type:'alien',label:'Alien Patrol'},
  {x:78,y:68,type:'mineral',label:'Mineral Deposit'},
];
const ICON = { mineral:'&#129704;', alien:'&#128123;' };
const nodesEl = document.getElementById('nodes');
const toast = document.getElementById('toast');
const toastCard = document.getElementById('toastCard');
const toastBtn = document.getElementById('toastBtn');
const progressText = document.getElementById('progressText');
let revealedCount = 0;
let busy = false;

function smoothPath(pts) {
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p = pts[i], n = pts[i + 1];
    const mx = (p.x + n.x) / 2, my = (p.y + n.y) / 2;
    d += ` Q ${p.x} ${p.y} ${mx} ${my}`;
  }
  d += ` T ${pts[pts.length - 1].x} ${pts[pts.length - 1].y}`;
  return d;
}
document.getElementById('trailPath').setAttribute('d', smoothPath(LOCATIONS));

LOCATIONS.forEach((loc, i) => {
  const el = document.createElement('div');
  el.className = 'node';
  el.style.left = loc.x + '%';
  el.style.top = loc.y + '%';
  el.innerHTML = '?<div class="node-label">' + loc.label + '</div>';
  el.style.animationDelay = (i * 0.15) + 's';
  el.onclick = () => reveal(el, loc);
  nodesEl.appendChild(el);
});

function reveal(el, loc) {
  if (busy || el.classList.contains('revealed')) return;
  busy = true;
  el.classList.add('revealed', loc.type);
  el.innerHTML = ICON[loc.type] + '<div class="node-label">' + loc.label + '</div>';
  revealedCount++;
  progressText.textContent = revealedCount + ' / ' + LOCATIONS.length + ' diterokai';

  document.querySelectorAll('.node').forEach(function(n) {
    if (!n.classList.contains('revealed')) n.classList.add('locked-temp');
  });

  const msg = loc.type === 'mineral'
    ? '<b>&#129704; Mineral Deposit!</b>Sedia untuk melombong.'
    : '<b>&#128123; Alien Muncul!</b>Bersedia untuk bertempur.';
  toastCard.innerHTML = msg;
  toast.classList.add('show');
}

toastBtn.onclick = function() {
  toast.classList.remove('show');
  document.querySelectorAll('.node.locked-temp').forEach(function(n) { n.classList.remove('locked-temp'); });
  busy = false;
};
</script>
