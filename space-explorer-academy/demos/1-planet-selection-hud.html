  :root {
    --cy: #4deaff;
    --cy-dim: #1c8fa8;
    --bg0: #01050a;
    --bg1: #041826;
    --amber: #ffb020;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg0); overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; user-select:none; }
  #stage { position:relative; width:100%; height:100vh; max-width:520px; margin:0 auto; overflow:hidden;
    background:radial-gradient(ellipse at 50% 38%, #0a2438 0%, #041220 45%, #00060c 100%); }

  /* ---------- background HUD dressing ---------- */
  .bg-grid {
    position:absolute; left:0; right:0; bottom:0; height:46%;
    background-image:
      linear-gradient(to top, transparent 0%, transparent 100%),
      repeating-linear-gradient(0deg, rgba(77,234,255,.16) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(77,234,255,.16) 0 1px, transparent 1px 34px);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.9), transparent 100%);
    mask-image: linear-gradient(to top, rgba(0,0,0,.9), transparent 100%);
    transform: perspective(320px) rotateX(62deg);
    transform-origin: bottom center;
    opacity:.55;
  }
  .bg-grid.top {
    top:0; bottom:auto; height:30%;
    transform: perspective(320px) rotateX(-62deg);
    transform-origin: top center;
    opacity:.28;
  }
  .scanlines {
    position:absolute; inset:0; pointer-events:none; z-index:6; opacity:.5;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
  }
  .scan-sweep {
    position:absolute; left:0; right:0; height:120px; z-index:6; pointer-events:none;
    background:linear-gradient(to bottom, transparent, rgba(77,234,255,.08), transparent);
    animation: sweep 5s linear infinite;
  }
  @keyframes sweep { 0%{ transform:translateY(-140px);} 100%{ transform:translateY(100vh);} }
  .vignette { position:absolute; inset:0; z-index:5; pointer-events:none;
    box-shadow: inset 0 0 140px 40px #000c, inset 0 0 60px 10px #000a; }
  .particles { position:absolute; inset:0; z-index:2; pointer-events:none; }
  .particle {
    position:absolute; width:2px; height:2px; border-radius:50%; background:var(--cy);
    box-shadow:0 0 6px 1px var(--cy); opacity:.6; animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100%{ opacity:.15; transform:scale(1);} 50%{ opacity:.9; transform:scale(1.6);} }

  /* ---------- top HUD bar ---------- */
  .hud-top { position:absolute; top:0; left:0; right:0; z-index:8; padding:16px 18px 0; text-align:center; }
  .hud-title {
    font-family:'Baloo 2',sans-serif; font-weight:900; font-size:15px; letter-spacing:5px; color:var(--cy);
    text-shadow:0 0 10px rgba(77,234,255,.85), 0 0 26px rgba(77,234,255,.4);
  }
  .hud-readout {
    margin-top:4px; font-family:'Baloo 2',sans-serif; font-size:9.5px; letter-spacing:1.5px;
    color:var(--cy-dim); display:flex; justify-content:center; gap:14px;
  }
  .hud-readout span b { color:var(--cy); font-weight:700; }
  .hud-rule { margin:10px auto 0; height:1px; width:88%; background:linear-gradient(90deg,transparent,rgba(77,234,255,.6),transparent); }

  /* ---------- carousel ---------- */
  .carousel-viewport {
    position:absolute; inset:0; z-index:4;
    display:flex; align-items:center;
    overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none; cursor:grab;
  }
  .carousel-viewport::-webkit-scrollbar { display:none; }
  .carousel-viewport.dragging { cursor:grabbing; scroll-snap-type:none; }
  .carousel-track { display:flex; align-items:center; height:100%; }
  .planet-slide {
    flex:0 0 auto; scroll-snap-align:center;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .slide-inner { position:relative; display:flex; flex-direction:column; align-items:center; will-change:transform,opacity,filter; }

  .orb-wrap { position:relative; width:150px; height:150px; }
  .orb {
    width:100%; height:100%; border-radius:50%; position:relative; overflow:hidden;
    box-shadow: 0 0 40px 6px var(--orb-glow, rgba(77,234,255,.5)), inset -14px -14px 30px rgba(0,0,0,.55), inset 8px 8px 24px rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.25);
  }
  .orb.photo { background-size:cover; background-position:center; }
  .orb.css-orb {
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 42%),
      radial-gradient(circle at 65% 70%, rgba(0,0,0,.35), transparent 55%),
      radial-gradient(circle at 50% 50%, var(--orb-c1), var(--orb-c2) 70%, var(--orb-c3) 100%);
  }

  .ring {
    position:absolute; inset:-16px; border-radius:50%;
    border:1.5px dashed var(--cy); opacity:0;
    animation: ringspin 12s linear infinite;
    box-shadow:0 0 16px rgba(77,234,255,.35);
  }
  .ring2 {
    position:absolute; inset:-30px; border-radius:50%;
    border:1px solid rgba(77,234,255,.35); opacity:0;
  }
  @keyframes ringspin { from{ transform:rotate(0);} to{ transform:rotate(360deg);} }

  .bracket { position:absolute; width:22px; height:22px; opacity:0; transition:opacity .3s ease; }
  .bracket::before, .bracket::after { content:''; position:absolute; background:var(--cy); box-shadow:0 0 6px var(--cy); }
  .bracket.tl { top:-38px; left:-38px; }
  .bracket.tr { top:-38px; right:-38px; transform:scaleX(-1); }
  .bracket.bl { bottom:-38px; left:-38px; transform:scaleY(-1); }
  .bracket.br { bottom:-38px; right:-38px; transform:scale(-1,-1); }
  .bracket::before { width:100%; height:2px; top:0; left:0; }
  .bracket::after { width:2px; height:100%; top:0; left:0; }

  .lock-badge {
    position:absolute; top:6px; right:6px; z-index:2;
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(10,4,0,.7); border:1px solid var(--amber); color:var(--amber); font-size:12px;
    box-shadow:0 0 10px rgba(255,176,32,.5);
  }

  .slide-label {
    margin-top:14px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:10px;
    letter-spacing:2px; color:#a9d6e8; opacity:.7; text-align:center; white-space:nowrap;
    text-shadow:0 0 8px rgba(77,234,255,.3);
  }

  /* ---------- side arrows ---------- */
  .hud-arrow {
    position:absolute; top:50%; transform:translateY(-50%); z-index:9;
    width:38px; height:38px; border-radius:50%; border:1px solid rgba(77,234,255,.5);
    background:rgba(4,20,32,.55); color:var(--cy); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 14px rgba(77,234,255,.25);
  }
  .hud-arrow:active { transform:translateY(-50%) scale(.9); }
  .hud-arrow.left { left:10px; }
  .hud-arrow.right { right:10px; }

  /* ---------- bottom readout ---------- */
  .hud-bottom {
    position:absolute; left:0; right:0; bottom:0; z-index:8;
    padding:14px 20px 22px; text-align:center;
    background:linear-gradient(to top, #01050ae8 30%, transparent);
  }
  .planet-index { font-family:'Baloo 2',sans-serif; font-size:10px; letter-spacing:3px; color:var(--cy-dim); margin-bottom:2px; }
  .planet-name-readout {
    font-family:'Baloo 2',sans-serif; font-weight:900; font-size:20px; letter-spacing:2px; color:#fff;
    text-shadow:0 0 12px rgba(77,234,255,.7); margin-bottom:4px;
  }
  .planet-status { font-family:'Baloo 2',sans-serif; font-size:10px; letter-spacing:2px; margin-bottom:12px; }
  .planet-status.unlocked { color:#5cffb0; text-shadow:0 0 8px rgba(92,255,176,.6); }
  .planet-status.locked { color:var(--amber); text-shadow:0 0 8px rgba(255,176,32,.5); }

  .confirm-btn {
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:11px; letter-spacing:2px;
    padding:12px 30px; border-radius:6px; cursor:pointer;
    background:linear-gradient(135deg, rgba(77,234,255,.25), rgba(77,234,255,.08));
    border:1px solid var(--cy); color:var(--cy);
    box-shadow:0 0 18px rgba(77,234,255,.35), inset 0 0 12px rgba(77,234,255,.15);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  }
  .confirm-btn:disabled { opacity:.35; cursor:not-allowed; border-color:var(--amber); color:var(--amber); box-shadow:none; }
  .confirm-btn:not(:disabled):active { transform:scale(.96); }

  .mission-overlay { position:absolute; inset:0; z-index:20; display:none;
    background:radial-gradient(ellipse at 50% 38%, #0a2438 0%, #041220 45%, #00060c 100%); }
  .mission-overlay.show { display:block; }
  .mo-skip { position:absolute; top:14px; right:14px; z-index:22;
    font-family:'Baloo 2',sans-serif; font-size:9px; letter-spacing:1.5px; font-weight:700;
    background:rgba(4,20,32,.6); border:1px solid rgba(77,234,255,.4); color:var(--cy-dim);
    padding:7px 12px; cursor:pointer; clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px); }
  .mo-panel { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;

const viewport = document.getElementById('viewport');
const track = document.getElementById('track');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const planetName = document.getElementById('planetName');
const planetStatus = document.getElementById('planetStatus');
const planetIndex = document.getElementById('planetIndex');
const confirmBtn = document.getElementById('confirmBtn');
const targetCount = document.getElementById('targetCount');
const particlesEl = document.getElementById('particles');

targetCount.textContent = PLANETS.length;

for (let i = 0; i < 22; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = (Math.random() * 100) + '%';
  p.style.top = (Math.random() * 100) + '%';
  p.style.animationDelay = (Math.random() * 3.5) + 's';
  particlesEl.appendChild(p);
}

let LANE = 168;

PLANETS.forEach((p, i) => {
  const slide = document.createElement('div');
  slide.className = 'planet-slide';
  slide.dataset.i = i;
  slide.style.width = LANE + 'px';

  const orbHtml = p.img
    ? `<div class="orb photo" style="background-image:url('${p.img}')"></div>`
    : `<div class="orb css-orb" style="--orb-c1:${p.c1};--orb-c2:${p.c2};--orb-c3:${p.c3};--orb-glow:${p.glow}"></div>`;

  slide.innerHTML = `
    <div class="slide-inner">
      <div class="orb-wrap" style="--orb-glow:${p.glow || 'rgba(77,234,255,.5)'}">
        <div class="ring"></div>
        <div class="ring2"></div>
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
        ${orbHtml}
        ${p.locked ? '<div class="lock-badge">&#128274;</div>' : ''}
      </div>
      <div class="slide-label">${p.name.toUpperCase()}</div>
    </div>
  `;
  track.appendChild(slide);
});

function layout() {
  const vw = viewport.clientWidth;
  const pad = Math.max(0, (vw - LANE) / 2);
  track.style.paddingLeft = pad + 'px';
  track.style.paddingRight = pad + 'px';
}
layout();
addEventListener('resize', layout);

let activeIndex = 0;
let rafPending = false;

function updateTransforms() {
  rafPending = false;
  const vpRect = viewport.getBoundingClientRect();
  const centerX = vpRect.left + vpRect.width / 2;
  let nearest = 0, nearestDist = Infinity;

  track.querySelectorAll('.planet-slide').forEach(slide => {
    const r = slide.getBoundingClientRect();
    const slideCenter = r.left + r.width / 2;
    const d = (slideCenter - centerX) / LANE;
    const ad = Math.min(Math.abs(d), 2.2);

    const scale = Math.max(0.55, 1.28 - ad * 0.42);
    const opacity = Math.max(0.55, 1 - ad * 0.32);
    const bright = Math.max(0.6, 1 - ad * 0.32);
    const rotY = Math.max(-24, Math.min(24, -d * 22));
    const inner = slide.querySelector('.slide-inner');
    inner.style.transform = `perspective(600px) rotateY(${rotY}deg) scale(${scale})`;
    inner.style.opacity = opacity;
    inner.style.filter = `brightness(${bright}) saturate(${0.6 + (1-Math.min(ad,1))*0.6})`;

    const isActive = ad < 0.18;
    slide.querySelectorAll('.ring, .ring2, .bracket').forEach(el => el.style.opacity = isActive ? (el.classList.contains('ring2') ? '.5' : (el.classList.contains('ring') ? '.85' : '.95')) : '0');
    slide.querySelector('.slide-label').style.opacity = isActive ? '1' : '.55';

    if (Math.abs(d) < nearestDist) { nearestDist = Math.abs(d); nearest = Number(slide.dataset.i); }
  });

  if (nearest !== activeIndex) {
    activeIndex = nearest;
    updateReadout();
  }
}

function updateReadout() {
  const p = PLANETS[activeIndex];
  planetName.textContent = p.name.toUpperCase();
  planetIndex.textContent = 'TARGET ' + String(activeIndex + 1).padStart(2, '0') + ' / ' + PLANETS.length;
  planetStatus.textContent = p.locked ? 'STATUS: LOCKED' : 'STATUS: UNLOCKED';
  planetStatus.className = 'planet-status ' + (p.locked ? 'locked' : 'unlocked');
  confirmBtn.disabled = p.locked;
  confirmBtn.innerHTML = p.locked ? '&#128274; LOCKED' : '&#9654; CONFIRM DESTINATION';
}

function onScroll() {
  if (!rafPending) { rafPending = true; requestAnimationFrame(updateTransforms); }
}
viewport.addEventListener('scroll', onScroll, { passive: true });

function goTo(i) {
  i = Math.max(0, Math.min(PLANETS.length - 1, i));
  const slide = track.children[i];
  const target = slide.offsetLeft + slide.offsetWidth / 2 - viewport.clientWidth / 2;
  viewport.scrollTo({ left: target, behavior: 'smooth' });
}
prevBtn.onclick = () => goTo(activeIndex - 1);
nextBtn.onclick = () => goTo(activeIndex + 1);
confirmBtn.onclick = () => {
  if (!PLANETS[activeIndex].locked) startMission(PLANETS[activeIndex]);
};

let isDown = false, startX = 0, startScroll = 0;
viewport.addEventListener('pointerdown', e => {
  isDown = true;
  viewport.classList.add('dragging');
  startX = e.clientX;
  startScroll = viewport.scrollLeft;
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener('pointermove', e => {
  if (!isDown) return;
  viewport.scrollLeft = startScroll - (e.clientX - startX);
});
function endDrag() {
  if (!isDown) return;
  isDown = false;
  viewport.classList.remove('dragging');
  const closest = Array.from(track.children).reduce((best, slide) => {
    const r = slide.getBoundingClientRect();
    const vp = viewport.getBoundingClientRect();
    const d = Math.abs((r.left + r.width / 2) - (vp.left + vp.width / 2));
    return d < best.d ? { d, i: Number(slide.dataset.i) } : best;
  }, { d: Infinity, i: 0 });
  goTo(closest.i);
}
viewport.addEventListener('pointerup', endDrag);
viewport.addEventListener('pointercancel', endDrag);

viewport.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    viewport.scrollLeft += e.deltaY;
    e.preventDefault();
  }
}, { passive: false });

setTimeout(() => { layout(); updateTransforms(); updateReadout(); }, 30);

/* ---------------- Mission sequence: Confirm Destination -> Player Control ---------------- */
const missionOverlay = document.getElementById('missionOverlay');
const moPanel = document.getElementById('moPanel');
const moSkip = document.getElementById('moSkip');
let missionPlanet = null;

function setMissionColor(hex) { document.documentElement.style.setProperty('--mission-c', hex); }

const demoState = { fuel: 35, energy: 100, hp: 100, mineral: 24 };

function startMission(planet) {
  missionPlanet = planet;
  setMissionColor('#4deaff');
  missionOverlay.classList.add('show');
  moSkip.style.display = 'block';
  moSkip.onclick = () => hubPlanet(planet); // skip bypasses the whole cinematic straight to player control
  planetDetail(planet);
}

function fbar(label, val, max, color) {
  const pct = Math.round(val / max * 100);
  return `<div class="mo-fuel-row"><span class="flabel">${label}</span>
    <div class="fbar-wrap"><div class="fbar" style="width:${pct}%;background:${color}"></div></div>
    <span class="fval">${pct}%</span></div>`;
}

function planetDetail(planet) {
  moPanel.className = 'mo-panel zoomer';
  moPanel.innerHTML = `
    <div class="mo-title">TARGET LOCKED</div>
    <div class="mo-name">${planet.name.toUpperCase()}</div>
    <div class="mo-stars">${'&#9733;'.repeat(planet.stars)}${'&#9734;'.repeat(3 - planet.stars)}</div>
    <div class="mo-hud-grid">
      <div class="mo-stat"><span>KADAR BAHAYA</span><b>${planet.danger}</b></div>
      <div class="mo-stat"><span>MINERAL UTAMA</span><b>${planet.mainMineral}</b></div>
      <div class="mo-stat"><span>ANGGARAN MONSTER</span><b>${planet.monCount}</b></div>
    </div>
    <button class="mo-btn" id="moGo">TERUSKAN MISI</button>
  `;
  document.getElementById('moGo').onclick = () => preFlightCheck(planet);
}

  moPanel.innerHTML = `

    ${fbar('&#9889; ENERGY CORE', demoState.energy, 100, 'var(--cy)')}

    <div class="mo-btn-row">
      ${fuelOk
        ? '<button class="mo-btn" id="moGo">BERLEPAS</button>'
        : '<button class="mo-btn" id="moWorkshop">TOP UP FUEL</button><button class="mo-btn ghost" id="moBack">KEMBALI</button>'}
    </div>
  `;
  if (fuelOk) {
    document.getElementById('moGo').onclick = () => launchSequence(planet);
  } else {
    document.getElementById('moWorkshop').onclick = () => workshop(planet);
    document.getElementById('moBack').onclick = () => closeMission();
  }
}

function workshop(planet) {
  moPanel.className = 'mo-panel zoomer';
  moPanel.innerHTML = `
    <div class="mo-title">WORKSHOP</div>
    ${fbar('&#129704; MINERAL', demoState.mineral, 100, 'var(--mission-c,var(--cy))')}
    <div class="mo-btn-row">
      <button class="mo-btn small" id="moFuelUp">ISI FUEL (-10)</button>
      <button class="mo-btn small" id="moRepair">REPAIR SHIP (-5)</button>
      <button class="mo-btn small ghost" disabled>UPGRADE WEAPON (SOON)</button>
      <button class="mo-btn small ghost" disabled>UPGRADE TANK (SOON)</button>
    </div>
    <div id="moWorkshopMsg" class="mo-toast"></div>
    <button class="mo-btn ghost" id="moBack">KEMBALI</button>
  `;
  const msg = document.getElementById('moWorkshopMsg');
  document.getElementById('moFuelUp').onclick = () => {
    if (demoState.mineral < 10) { msg.textContent = 'Mineral tidak cukup.'; return; }
    demoState.mineral -= 10;
    demoState.fuel = 100;
    msg.textContent = '&#9989; Fuel diisi penuh.';
    workshop(planet);
  };
  document.getElementById('moRepair').onclick = () => {
    if (demoState.mineral < 5) { msg.textContent = 'Mineral tidak cukup.'; return; }
    demoState.mineral -= 5;
    demoState.hp = 100;
    msg.textContent = '&#9989; Ship direstore.';
    workshop(planet);
  };
  document.getElementById('moBack').onclick = () => preFlightCheck(planet);
}

function launchSequence(planet) {
  moPanel.className = 'mo-panel';
  moPanel.innerHTML = `<div class="mo-terminal" id="moTerm"></div>`;
  const term = document.getElementById('moTerm');
  const lines = ['ENGINE START...', '...', '...', 'LIFTOFF'];
  lines.forEach((l, i) => {
    setTimeout(() => {
      const d = document.createElement('div');
      d.textContent = l;
      term.appendChild(d);
    }, i * 450);
  });
  setTimeout(() => quickWarp(planet), lines.length * 450 + 400);
}

function quickWarp(planet) {
  moPanel.className = 'mo-panel';
  moPanel.innerHTML = `<div class="mo-warp-dark"><div class="mo-warp-lines" id="warpLines"></div></div>`;
  const linesEl = document.getElementById('warpLines');
  for (let i = 0; i < 28; i++) {
    const l = document.createElement('div');
    l.className = 'mo-warp-line';
    l.style.transform = `rotate(${Math.random() * 360}deg)`;
    l.style.animationDelay = (Math.random() * 150) + 'ms';
    linesEl.appendChild(l);
  }
  setTimeout(() => arrivalScreen(planet), 1300);
}

function closeMission() {
  missionOverlay.classList.remove('show');
  setMissionColor('#4deaff');
}

function arrivalScreen(planet) {
  setMissionColor(planet.color);
  moPanel.className = 'mo-panel zoomer';
  moPanel.innerHTML = `
    <div class="mo-emoji">&#127769;</div>
    <div class="mo-arrival-big">ANDA TELAH MENDARAT DI<br>${planet.name.toUpperCase()}</div>
  `;
  setTimeout(() => missionListScreen(planet), 2200);
}

function missionListScreen(planet) {
  moPanel.className = 'mo-panel';
  moSkip.style.display = 'none';
  const missions = [
    `Kumpulkan ${planet.mainMineral}`,
    `Kalahkan ${planet.enemies.join(', ')}`,
    `Kalahkan Boss planet`,
  ];
  const list = missions.map((m, i) => `<div class="mission-item"><b>MISI ${i + 1}</b><br>${m}</div>`).join('');
  moPanel.innerHTML = `
    <div class="mo-title">SENARAI MISI</div>
    <div class="mission-list">${list}</div>
    <button class="mo-btn" id="moGo">MULA MISI</button>
  `;
  document.getElementById('moGo').onclick = () => hubPlanet(planet);
}

function hubPlanet(planet) {
  moPanel.className = 'mo-panel';
  moSkip.style.display = 'none';
  moPanel.innerHTML = `
    <div class="mo-title">${planet.name.toUpperCase()} &mdash; HUB</div>
    <div class="mo-hub-grid">
      <button class="mo-hub-btn" data-a="explore">&#128270; TEROKA KAWASAN</button>
      <button class="mo-hub-btn" data-a="mine">&#129704; KUTIP MINERAL</button>
      <button class="mo-hub-btn" data-a="fight">&#9876;&#65039; LAWAN MONSTER</button>
      <button class="mo-hub-btn" data-a="map">&#128506;&#65039; BUKA PETA</button>
    </div>
    <div class="mo-toast" id="hubToast"></div>
    <button class="mo-btn ghost" id="moBack" style="margin-top:8px">KEMBALI KE CAROUSEL</button>
  `;
  const toast = document.getElementById('hubToast');
  const msgs = {
    explore: 'Meneroka kawasan sekitar...',
    mine: 'Mengutip mineral &mdash; gameplay belum dibina dalam demo ini.',
    fight: 'Battle bermula &mdash; gameplay belum dibina dalam demo ini.',
    map: 'Peta planet belum dibina dalam demo ini.',
  };
  moPanel.querySelectorAll('.mo-hub-btn').forEach(b => {
    b.onclick = () => { toast.innerHTML = msgs[b.dataset.a]; };
  });
  document.getElementById('moBack').onclick = closeMission;
}

</script>
