  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:'Baloo 2',sans-serif;
    background:linear-gradient(180deg,#2a2f7a 0%,#3d4fc4 55%,#5b6ee8 100%); }
  #stage { position:relative; max-width:480px; margin:0 auto; height:100vh; overflow:hidden; display:flex; flex-direction:column; }

  .top { padding:14px 16px 0; text-align:center; }
  .top h1 { color:#fff700; font-size:16px; text-shadow:0 2px 0 #7a4a00; margin:0 0 8px; letter-spacing:1px; }
  .hud-row { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }
  .hud-chip { background:rgba(255,255,255,.92); color:#232946; font-size:12px; font-weight:800;
    padding:6px 12px; border-radius:999px; box-shadow:0 3px 8px rgba(0,0,0,.15); }
  .hud-chip.mineral { background:linear-gradient(135deg,#ffe27a,#ff9f1c); color:#3a2a6d; }
  .energy-wrap { width:140px; height:10px; border-radius:6px; background:rgba(255,255,255,.25); overflow:hidden; margin:8px auto 0; }
  .energy-bar { height:100%; background:linear-gradient(90deg,#5cffb0,#22c55e); width:100%; transition:width .5s ease; }

  .mi-icon { font-size:26px; flex:0 0 auto; }

  .mi-text b { font-size:14px; color:#5b3fc9; }
  .mi-text span { font-size:11px; color:#4a4f6b; }
  .rock-wrap { position:relative; }
  .rock { font-size:96px; filter:drop-shadow(0 10px 14px rgba(0,0,0,.3)); display:block; }
  .rock.impact { animation:rockRecoil .42s ease, rockFlash .42s ease; }
  @keyframes rockRecoil {
    0%{transform:translateX(0) rotate(0) scale(1);}
    12%{transform:translateX(-14px) rotate(-6deg) scale(.92);}
    30%{transform:translateX(10px) rotate(4deg) scale(1.06);}
    50%{transform:translateX(-6px) rotate(-2deg) scale(1.01);}
    70%{transform:translateX(3px) rotate(1deg) scale(1);}
    100%{transform:translateX(0) rotate(0) scale(1);}
  }
  @keyframes rockFlash {
    0%{ filter:drop-shadow(0 10px 14px rgba(0,0,0,.3)) brightness(1); }
    12%{ filter:drop-shadow(0 10px 14px rgba(0,0,0,.3)) brightness(3) saturate(1.6); }
    35%{ filter:drop-shadow(0 10px 14px rgba(0,0,0,.3)) brightness(1.5); }
    100%{ filter:drop-shadow(0 10px 14px rgba(0,0,0,.3)) brightness(1); }
  }
  .rock.miss { animation:rockShrug .3s ease; }
  @keyframes rockShrug { 0%,100%{transform:rotate(0);} 30%{transform:rotate(-4deg);} 60%{transform:rotate(4deg);} }

  .laser { position:absolute; left:50%; bottom:-10px; width:6px; height:0; margin-left:-3px;
    background:linear-gradient(to top,#fff700,#ff9f1c 70%,transparent); border-radius:4px;
    box-shadow:0 0 14px 3px #fff70099; opacity:0; }
  .laser.fire { animation:laserFire .28s ease-out forwards; }
  @keyframes laserFire {
    0%{ height:0; opacity:1; }
    60%{ height:220px; opacity:1; }
    100%{ height:220px; opacity:0; }
  }

  .spark { position:absolute; border-radius:50%; pointer-events:none; left:50%; top:50%;
    animation:sparkFly .6s ease-out forwards; }
  @keyframes sparkFly { 0%{opacity:1; transform:translate(-50%,-50%) scale(1);} 100%{opacity:0; transform:translate(calc(-50% + var(--sx)), calc(-50% + var(--sy))) scale(0);} }

  .whiteflash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:9; }
  .whiteflash.go { animation:wflash .3s ease-out forwards; }
  @keyframes wflash { 0%{opacity:.7;} 100%{opacity:0;} }

  .reward-float { position:absolute; left:50%; top:38%; transform:translateX(-50%);

  .reward-float.go { animation:rewardFloat 1.1s ease-out forwards; }
  @keyframes rewardFloat {
    0%{ opacity:0; transform:translate(-50%,0) scale(.6); }
    20%{ opacity:1; transform:translate(-50%,-10px) scale(1.15); }
    70%{ opacity:1; transform:translate(-50%,-55px) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-85px) scale(1); }
  }
  .reward-float.miss { color:#ff8ba7; font-size:16px; text-shadow:0 2px 0 #5c0a1f; }

  .choice-btn:active { transform:translateY(2px); box-shadow:0 1px 0 #c7ccf7; }
  .choice-btn.correct { background:#7CFFB2; box-shadow:0 3px 0 #1f9d55; }
  .choice-btn.wrong { background:#ff8ba7; color:#fff; box-shadow:0 3px 0 #b3324f; }
  .choice-btn:disabled { cursor:default; }

  .summary { position:absolute; inset:0; background:linear-gradient(180deg,#2a2f7a,#5b6ee8); z-index:20;
    display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; gap:14px; }
  .summary.show { display:flex; }
  .summary h2 { color:#fff700; font-size:22px; text-shadow:0 2px 0 #7a4a00; margin:0; }
  .summary .big { font-size:40px; }
  .summary .total { background:rgba(255,255,255,.95); color:#232946; border-radius:16px; padding:16px 26px; font-size:20px; font-weight:800; }
  .summary .btn { border:none; border-radius:999px; padding:13px 30px; font-family:'Baloo 2',sans-serif;
    font-weight:800; font-size:14px; cursor:pointer; background:linear-gradient(135deg,#ffd23f,#ff9f1c); color:#3a2a6d; box-shadow:0 5px 0 #c97400; }

  .coach { position:absolute; left:10px; bottom:6px; z-index:8; display:flex; align-items:flex-end; gap:8px; max-width:70%; }
  .coach-avatar { width:64px; height:64px; border-radius:50%; flex:0 0 auto;

    box-shadow:0 4px 10px rgba(0,0,0,.25); animation:coachBob 2.4s ease-in-out infinite; }
  .coach-avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }

      <div class="coach-bubble" id="coachBubble">Sedia untuk melombong!</div>
    </div>
  </div>

  <div class="qcard">
    <div class="qprompt" id="qPrompt">3 + 4 = ?</div>
    <div class="choices" id="choices"></div>
  </div>

  <div class="summary" id="summary">
    <div class="big">&#127942;</div>
    <h2>SESI MELOMBONG SELESAI!</h2>
    <div class="total" id="summaryTotal">&#129704; 0 Mineral Dikumpul</div>
    <button class="btn" id="btnRestart">MAIN SEMULA</button>
  </div>
</div>

<script>
const TOTAL_Q = 10;
let qIndex = 0;
let totalMineral = 0;
let qStart = 0;
let energy = 100;
const ORE_ICON = '\u{1FAA8}';

const qCounter = document.getElementById('qCounter');
const mineralCounter = document.getElementById('mineralCounter');
const energyBar = document.getElementById('energyBar');
const qPrompt = document.getElementById('qPrompt');
const choicesEl = document.getElementById('choices');
const rock = document.getElementById('rock');
const laser = document.getElementById('laser');
const whiteflash = document.getElementById('whiteflash');
const rewardFloat = document.getElementById('rewardFloat');
const rockWrap = document.getElementById('rockWrap');
const summary = document.getElementById('summary');
const summaryTotal = document.getElementById('summaryTotal');

function genQuestion() {
  const a = 2 + Math.floor(Math.random() * 10);
  const b = 1 + Math.floor(Math.random() * 9);
  const isAdd = Math.random() < 0.5;
  const answer = isAdd ? a + b : Math.max(a, b) - Math.min(a, b);
  const prompt = isAdd ? `${a} + ${b} = ?` : `${Math.max(a,b)} - ${Math.min(a,b)} = ?`;
  const opts = new Set([answer]);
  while (opts.size < 4) {
    const delta = 1 + Math.floor(Math.random() * 5);
    const cand = answer + (Math.random() < 0.5 ? delta : -delta);
    if (cand >= 0) opts.add(cand);
  }
  const choices = [...opts].sort(() => Math.random() - 0.5);
  return { prompt, answer, choices };
}

const MINERALS = [
  { name: 'Besi', icon: '&#129704;', desc: 'boleh digunakan untuk membaiki kapal angkasa' },
  { name: 'Perak', icon: '&#129713;', desc: 'boleh digunakan untuk upgrade senjata laser' },
  { name: 'Kristal Cyan', icon: '&#128142;', desc: 'boleh digunakan untuk mengecas Energy Core' },
  { name: 'Emas', icon: '&#129704;', desc: 'boleh ditukar dengan Coins galaksi' },
  { name: 'Ais Biru', icon: '&#10052;&#65039;', desc: 'boleh digunakan untuk membuat perisai (shield)' },
];
let currentMineral = MINERALS[0];
const miIcon = document.getElementById('miIcon');
const miName = document.getElementById('miName');
const miDesc = document.getElementById('miDesc');

function pickMineral() {
  currentMineral = MINERALS[Math.floor(Math.random() * MINERALS.length)];
  miIcon.innerHTML = currentMineral.icon;
  miName.textContent = currentMineral.name;
  miDesc.textContent = currentMineral.desc;
  rock.innerHTML = currentMineral.icon;
}

function startEnergy() {
  energy = 90;
  energyBar.style.width = energy + '%';
}

function nextQuestion() {
  if (qIndex >= TOTAL_Q) { finishSession(); return; }
  qIndex++;
  qCounter.textContent = `Soalan ${qIndex} / ${TOTAL_Q}`;
  pickMineral();
  const q = genQuestion();
  qPrompt.textContent = q.prompt;
  choicesEl.innerHTML = '';
  q.choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = () => answer(btn, c === q.answer);
    choicesEl.appendChild(btn);
  });
  qStart = performance.now();
}

function rewardForSpeed(sec) {
  if (sec <= 3) return { amount: 14, tier: 'fast' };
  if (sec <= 6) return { amount: 10, tier: 'fast' };
  if (sec <= 10) return { amount: 7, tier: 'ok' };
  return { amount: 4, tier: 'ok' };
}

const coachBubble = document.getElementById('coachBubble');
const COACH_MSG = {
  fast: ['Hebat! Teruskan!', 'Laju sungguh!', 'Power! Jangan berhenti!'],
  ok: ['Teruskan kumpul mineral!', 'Bagus, sambung lagi!', 'Mineral bertambah!'],
  miss: ['Takpe, cuba lagi!', 'Jangan risau, teruskan!', 'Hampir je tu!'],
};
function coachSay(kind) {
  const list = COACH_MSG[kind];
  coachBubble.textContent = list[Math.floor(Math.random() * list.length)];
}

function answer(btn, correct) {
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
  btn.classList.add(correct ? 'correct' : 'wrong');

  const sec = (performance.now() - qStart) / 1000;
  laser.classList.remove('fire'); void laser.offsetWidth; laser.classList.add('fire');

  setTimeout(() => {
    if (correct) {
      const r = rewardForSpeed(sec);
      totalMineral += r.amount;
      coachSay(r.tier);
      mineralCounter.textContent = ORE_ICON + ' ' + totalMineral;
      rock.classList.remove('impact'); void rock.offsetWidth; rock.classList.add('impact');
      whiteflash.classList.remove('go'); void whiteflash.offsetWidth; whiteflash.classList.add('go');
      spawnSparks(14);
      rewardFloat.className = 'reward-float go';
      rewardFloat.textContent = `+${r.amount} ${currentMineral.name}`;
    } else {
      rock.classList.remove('miss'); void rock.offsetWidth; rock.classList.add('miss');
      rewardFloat.className = 'reward-float go miss';
      rewardFloat.textContent = 'Cuba lagi!';
      coachSay('miss');
    }
  }, 260);

  setTimeout(nextQuestion, 1500);
}

function spawnSparks(n) {
  const colors = ['#fff700', '#ff9f1c', '#fff', '#ffd23f'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const size = 4 + Math.random() * 8;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    s.style.boxShadow = '0 0 6px currentColor';
    s.style.setProperty('--sx', ((Math.random() - 0.5) * 160) + 'px');
    s.style.setProperty('--sy', (-40 - Math.random() * 120) + 'px');
    s.style.animationDelay = (Math.random() * 0.1) + 's';
    rockWrap.appendChild(s);
    setTimeout(() => s.remove(), 700);
  }
}

function finishSession() {
  summary.classList.add('show');
  summaryTotal.textContent = ORE_ICON + ' ' + totalMineral + ' Mineral Dikumpul';
}

document.getElementById('btnRestart').onclick = () => {
  totalMineral = 0; qIndex = 0;
  mineralCounter.textContent = ORE_ICON + ' 0';
  summary.classList.remove('show');
  startEnergy();
  nextQuestion();
};

startEnergy();
nextQuestion();
</script>
