<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Preview — Monster Math Arena</title>
<!--
  ⚠️  BUILD PREVIEW SAHAJA — MELANGKAU GATE LESEN.

  Kenapa fail ni wujud: gate lesen MUSTAHIL dilepasi pd hos statik spt
  githack, sebab license.html hantar kod ke /api/validate-license iaitu
  fungsi serverless yg hanya ada di Vercel.

  Ia juga NYAHDAFTAR service worker & kosongkan semua cache dahulu.
  service-worker.js guna strategi cache-first ("if (cached) return cached")
  dan header no-cache dlm vercel.json TIDAK berkuat kuasa di githack -
  jadi SW lama akan sajikan index.html lama selama-lamanya. Tanpa
  pembersihan ni, preview sentiasa tunjuk versi lapuk.

  PADAM fail ni bila review selesai / repo ditukar ke private.
-->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#3B1A8A;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  .spin{font-size:52px;animation:s 1s linear infinite;display:inline-block}
  @keyframes s{to{transform:rotate(360deg)}}
  p{font-size:15px;font-weight:700;margin:14px 0 0}
  small{display:block;margin-top:10px;opacity:.75;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div>
  <div class="spin">🔄</div>
  <p id="msg">Membersihkan cache…</p>
  <small>Mod preview — gate lesen dilangkau &amp; cache lama dibuang.</small>
  <noscript><p>JavaScript diperlukan untuk membuka game.</p></noscript>
</div>
<script>
(async function () {
  var msg = document.getElementById('msg');
  try {
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function (r) { return r.unregister(); }));
    }
  } catch (e) {}
  try {
    if (window.caches) {
      var keys = await caches.keys();
      await Promise.all(keys.map(function (k) { return caches.delete(k); }));
    }
  } catch (e) {}
  try { localStorage.setItem('mma_license_valid', 'true'); } catch (e) {}
  if (msg) msg.textContent = 'Membuka versi terkini…';
  // cache-bust supaya CDN githack & browser tak sajikan salinan lama
  location.replace('index.html?fresh=' + Date.now());
})();
</script>
</body>
</html>
